function saveNoteToServer(key, text) {
  var state = document.getElementById('ns-' + key);
  function show(msg, ok) {
    if (!state) return;
    state.textContent = msg;
    state.style.color = ok ? 'var(--up)' : 'var(--down)';
    state.className = 'note-state show';
    if (ok) setTimeout(function() { state.className = 'note-state'; }, 1500);
  }
  try {
    if (window.google && google.script && google.script.run) {
      google.script.run
          .withSuccessHandler(function(res) {
            show(res === 'ok' ? 'saved' : 'not saved', res === 'ok');
          })
          .withFailureHandler(function() { show('not saved', false); })
          .saveNote(key, text);
    } else {
      show('preview only', false);
    }
  } catch (e) {
    show('not saved', false);
  }
}

function bindStoryboard() {
  var sp = document.getElementById('storyPromptBtn');
  if (sp) sp.onclick = function() {
    var b = document.getElementById('promptBtn'); if (b) b.click();
  };
  var sd = document.getElementById('storyDeckBtn');
  if (sd) sd.onclick = function() {
    var b = document.getElementById('deckBtn'); if (b) b.click();
  };

  var areas = document.querySelectorAll('#panel-story textarea.note');
  for (var i = 0; i < areas.length; i++) {
    (function(area) {
      var key = area.getAttribute('data-key');
      var timer = null;
      area.addEventListener('input', function() {
        NOTES[key] = area.value;
        var state = document.getElementById('ns-' + key);
        if (state) {
          state.textContent = 'saving…';
          state.style.color = 'var(--muted)';
          state.className = 'note-state show';
        }
        if (timer) clearTimeout(timer);
        timer = setTimeout(function() { saveNoteToServer(key, area.value); }, 700);
      });
    })(areas[i]);
  }
}

function render() {
  // Only the open section has a panel node; nothing to render when collapsed.
  if (!ACTIVE) return;
  var panel = document.getElementById('panel-' + ACTIVE);
  if (!panel) return;
  var searchBox = document.getElementById('search');
  var term = searchBox ? searchBox.value.toLowerCase().trim() : '';

  if (ACTIVE === 'story') {
    panel.innerHTML = drawStoryboard();
    bindStoryboard();
    return;
  }

  if (ACTIVE === 'videos') {
    panel.innerHTML = drawVideos(term);
    bindStars();
    bindThumbs();
    bindPlays();
    return;
  }

  if (ACTIVE === 'surfaces') {
    panel.innerHTML = drawSurfaces();
    return;
  }

  if (ACTIVE === 'settings') {
    panel.innerHTML = drawSettings();
    bindSettings();
    return;
  }

  if (ACTIVE === 'landingPages') {
    panel.innerHTML = drawLandingPages();
    return;
  }

  if (ACTIVE === 'audienceValidation') {
    panel.innerHTML = drawAudienceValidation();
    bindAudienceValidation();
    return;
  }

  if (ACTIVE === 'strategy') {
    panel.innerHTML = drawStrategy();
    bindStrategy();
    return;
  }

  if (ACTIVE === 'aiAnalysis') {
    panel.innerHTML = drawAiAnalysis();
    bindAiAnalysis();
    return;
  }

  if (ACTIVE === 'conversions') {
    panel.innerHTML = drawConversions(term);
    return;
  }

  if (ACTIVE === 'clientUpdate') {
    panel.innerHTML = drawClientUpdate();
    bindClientUpdate();
    return;
  }

  var view = VIEWS[ACTIVE];
  var PERF = perfColumns(ACTIVE);
  var rows = view.rows().slice();

  if (CHANNEL_FILTER && ACTIVE === 'ads') {
    rows = rows.filter(function(r) {
      return (r.channelMix || {})[CHANNEL_FILTER] > 0;
    });
  }
  // Net profit is revenue minus spend; derive it if an older payload predates
  // the server-side field so the column and sort still work after a hard reload.
  if (ACTIVE === 'ads') {
    rows.forEach(function(r) {
      if (r.netProfit === undefined || r.netProfit === null) {
        r.netProfit = (Number(r.orderValue) || 0) - (Number(r.cost) || 0);
      }
    });
  }
  if (PROFIT_ONLY && ACTIVE === 'ads') {
    rows = rows.filter(function(r) { return (Number(r.purchaseRoas) || 0) >= 1; });
  }
  if (term) {
    rows = rows.filter(function(r) {
      return view.first.search(r).toLowerCase().indexOf(term) !== -1;
    });
  }

  rows.sort(function(a, b) {
    var x = SORT.key === '_first' ? view.first.search(a) : (a[SORT.key] || 0);
    var y = SORT.key === '_first' ? view.first.search(b) : (b[SORT.key] || 0);
    if (x === y) return 0;
    return (x > y ? 1 : -1) * (SORT.asc ? 1 : -1);
  });

  document.getElementById('count').textContent = rows.length + ' rows' +
      (PROFIT_ONLY && ACTIVE === 'ads' ? ' · profitable' : '') +
      (CHANNEL_FILTER && ACTIVE === 'ads' ? ' · ' + CHANNEL_FILTER : '');

  if (!rows.length) {
    var why = 'Nothing matches. Clear the filter, or widen the window in the ' +
        'Settings tab and refresh.';
    if (PROFIT_ONLY && ACTIVE === 'ads') {
      why = 'No creative turned a real profit in this window — none returned ' +
          'purchase revenue above its spend. Turn off "Profitable only" to see ' +
          'every ad and where the money went.';
    }
    if (ACTIVE === 'placements' && !view.rows().length) {
      why = DATA.placementsSkipped
          ? 'Placements are switched off. Set "Include placements" to TRUE in ' +
            'the Settings tab and refresh. It is the slowest and least ' +
            'reliable slice for Demand Gen, which is why it ships off.'
          : 'Placements were requested but returned nothing. Demand Gen ' +
            'placement reporting is patchy \u2014 check the run log at the ' +
            'foot of this page for whether the API refused the query.';
    }
    panel.innerHTML = '<div class="scroll"><div class="empty">' + why +
        '</div></div>';
    return;
  }

  // The Ads table gets a leading checkbox column for the pause workflow.
  var pickable = ACTIVE === 'ads';
  var pickHead = pickable
      ? '<th class="pick"><input type="checkbox" id="pickAll" ' +
        'title="Select all shown"></th>' : '';

  var head = '<tr>' + pickHead + '<th data-key="_first">' + view.first.label +
      '</th>' +
      PERF.map(function(col) {
        var cls = col.key === SORT.key
            ? ' class="sorted' + (SORT.asc ? ' asc' : '') + '"' : '';
        return '<th' + cls + ' data-key="' + col.key + '">' + col.label + '</th>';
      }).join('') + '</tr>';

  var body = rows.map(function(r) {
    // Winner = the creative's purchase revenue beat its spend. Tint the row so
    // the profitable ones read at a glance without hunting the ROAS column.
    var win = ACTIVE === 'ads' && (Number(r.purchaseRoas) || 0) >= 1;
    var pick = pickable
        ? '<td class="pick"><input type="checkbox" class="rowpick" data-id="' +
          esc(String(r.id)) + '"' + (SELECTED[r.id] ? ' checked' : '') +
          '></td>' : '';
    return '<tr' + (win ? ' class="win"' : '') + '>' + pick +
        '<td class="name">' + view.first.cell(r) + '</td>' +
        PERF.map(function(col) {
          var v = r[col.key];
          var blank = !v && (col.label === 'Per action' || col.label === 'ROAS' ||
              col.key === 'cpc');
          return '<td class="num">' + (blank ? '—' : col.fmt(v)) + '</td>';
        }).join('') + '</tr>';
  }).join('');

  panel.innerHTML = (pickable ? pauseBarHtml(rows) : '') +
      '<div class="scroll"><table><thead>' + head +
      '</thead><tbody>' + body + '</tbody></table></div>' +
      (ACTIVE === 'daily' ? sparkline() : '');

  var headers = panel.querySelectorAll('th[data-key]');
  for (var i = 0; i < headers.length; i++) {
    headers[i].onclick = function() {
      var key = this.getAttribute('data-key');
      SORT = { key: key, asc: SORT.key === key ? !SORT.asc : false };
      render();
    };
  }

  if (pickable) bindPause(rows);
}

// --- pause underperformers ------------------------------------------------
function adKey(r) { return String(r.id); }

function hasPurchaseAction() {
  return !!(DATA.realImpact && DATA.realImpact.purchaseAction);
}

// An ad is an underperformer when it has spent past the floor and returned
// less purchase revenue than it cost (purchase ROAS < 1) — the money-losers.
// If the account has no purchase action wired up, ROAS is meaningless, so we
// fall back to "spent this much and drove no tracked conversions at all".
function isLoser(r) {
  if ((Number(r.cost) || 0) < PAUSE_MIN_SPEND) return false;
  if (hasPurchaseAction()) return (Number(r.purchaseRoas) || 0) < 1;
  return !(Number(r.conversions) || 0);
}

function selectedCount() {
  var n = 0; for (var k in SELECTED) if (SELECTED[k]) n++; return n;
}

function pauseBarHtml(rows) {
  var losers = rows.filter(isLoser).length;
  var n = selectedCount();
  var rule = hasPurchaseAction()
      ? 'spent ≥ ' + money(PAUSE_MIN_SPEND) + ', ROAS &lt; 1x'
      : 'spent ≥ ' + money(PAUSE_MIN_SPEND) + ', no conversions (no purchase ' +
        'action set)';
  return '<div class="pausebar" id="pauseBar">' +
    '<div class="pb-left">' +
      '<strong id="pbCount">' + n + '</strong> selected to pause' +
      '<span class="pb-hint"> · ' + losers + ' underperformer' +
        (losers === 1 ? '' : 's') + ' shown (' + rule + ')</span>' +
    '</div>' +
    '<div class="pb-right">' +
      '<label class="pb-floor">Min spend ' +
        '<input type="number" id="pbFloor" value="' + PAUSE_MIN_SPEND +
        '" min="0" step="10"></label>' +
      '<button class="filter" id="pbSelect">Select underperformers</button>' +
      '<button class="filter" id="pbClear">Clear</button>' +
      '<button class="pb-btn" id="pbCsv"' + (n ? '' : ' disabled') +
        '>⬇ Editor bulksheet</button>' +
      '<button class="pb-btn danger" id="pbPause"' + (n ? '' : ' disabled') +
        '>Pause ' + (n || '') + ' in Google Ads</button>' +
      (LAST_PAUSED.length
        ? '<button class="pb-btn undo" id="pbUndo" title="Re-enable the ads you ' +
          'just paused">↩ Undo pause (' + LAST_PAUSED.length + ')</button>'
        : '') +
    '</div>' +
  '</div>';
}

function refreshPauseBar() {
  var n = selectedCount();
  var c = document.getElementById('pbCount');
  if (c) c.textContent = n;
  var csv = document.getElementById('pbCsv');
  var pause = document.getElementById('pbPause');
  if (csv) csv.disabled = !n;
  if (pause) {
    pause.disabled = !n;
    pause.textContent = 'Pause ' + (n || '') + ' in Google Ads';
  }
}

function bindPause(rows) {
  // Index every ad, not just the visible rows, so a selection made before a
  // name/profit filter is still resolvable when the sheet or pause is fired.
  var byId = {};
  (DATA.ads || []).forEach(function(r) { byId[String(r.id)] = r; });

  var all = document.getElementById('pickAll');
  if (all) {
    all.checked = rows.length > 0 && rows.every(function(r) {
      return SELECTED[r.id];
    });
    all.onclick = function() {
      var on = this.checked;
      rows.forEach(function(r) { SELECTED[r.id] = on ? true : false; });
      render();
    };
  }

  var picks = document.querySelectorAll('.rowpick');
  for (var i = 0; i < picks.length; i++) {
    picks[i].onclick = function() {
      SELECTED[this.getAttribute('data-id')] = this.checked;
      refreshPauseBar();
    };
  }

  var floor = document.getElementById('pbFloor');
  if (floor) {
    floor.onchange = function() {
      PAUSE_MIN_SPEND = Math.max(0, Number(this.value) || 0);
      render();
    };
  }

  var sel = document.getElementById('pbSelect');
  if (sel) sel.onclick = function() {
    rows.forEach(function(r) { if (isLoser(r)) SELECTED[r.id] = true; });
    render();
  };

  var clr = document.getElementById('pbClear');
  if (clr) clr.onclick = function() { SELECTED = {}; render(); };

  var csv = document.getElementById('pbCsv');
  if (csv) csv.onclick = function() { downloadPauseSheet(byId); };

  var pause = document.getElementById('pbPause');
  if (pause) pause.onclick = function() { pauseSelected(byId); };

  var undo = document.getElementById('pbUndo');
  if (undo) undo.onclick = function() { undoLastPause(); };
}

function selectedAds(byId) {
  var out = [];
  for (var id in SELECTED) {
    if (SELECTED[id] && byId[id]) {
      var r = byId[id];
      out.push({ id: r.id, name: r.name, campaign: r.campaign,
                 adGroup: r.adGroup });
    }
  }
  return out;
}

function downloadPauseSheet(byId) {
  var ads = selectedAds(byId);
  if (!ads.length) { toast('Select at least one ad first.'); return; }
  var btn = document.getElementById('pbCsv');
  if (btn) { btn.disabled = true; btn.textContent = 'Building…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.ok) {
        triggerDownload(res.b64, res.name, 'text/csv');
        toast(res.count + ' ad' + (res.count === 1 ? '' : 's') +
            ' in the bulksheet — import it in Google Ads Editor.');
      } else {
        toast('Could not build the sheet: ' + ((res && res.error) || 'unknown'));
      }
      refreshPauseBar();
    })
    .withFailureHandler(function(e) {
      toast('Could not build the sheet: ' + (e && e.message || e));
      refreshPauseBar();
    })
    .pauseBulkSheet(ads);
}

function pauseSelected(byId) {
  var ads = selectedAds(byId);
  if (!ads.length) { toast('Select at least one ad first.'); return; }
  var msg = 'Pause ' + ads.length + ' ad' + (ads.length === 1 ? '' : 's') +
      ' in the live Google Ads account now?\n\nThis sets each to Paused ' +
      'immediately. You can re-enable them in Google Ads or Editor. Nothing is ' +
      'deleted.';
  if (!window.confirm(msg)) return;
  var btn = document.getElementById('pbPause');
  if (btn) { btn.disabled = true; btn.textContent = 'Pausing…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.ok) {
        var changed = res.changed || [];
        var p = changed.length, s = (res.skipped || []).length,
            nf = (res.notFound || []).length;
        // Drop the paused ids from the selection; they're done. Remember them
        // so Undo can re-enable exactly this batch, and flip their status pill
        // now so the table reflects reality without waiting for a Refresh.
        changed.forEach(function(x) {
          delete SELECTED[x.adId];
          if (byId[x.adId]) byId[x.adId].status = 'PAUSED';
        });
        if (p) LAST_PAUSED = changed.slice();
        var note = p + ' paused';
        if (s) note += ', ' + s + ' already paused';
        if (nf) note += ', ' + nf + ' not found';
        if (res.warning) note += ' — ' + res.warning;
        toast(note + (p ? '. Use Undo to re-enable, or Refresh to update.' :
            '. Re-run Refresh to see updated status.'));
      } else {
        toast('Pause failed: ' + ((res && res.error) || 'unknown'));
      }
      render();
    })
    .withFailureHandler(function(e) {
      toast('Pause failed: ' + (e && e.message || e));
      render();
    })
    .pauseAds(CURRENT_ACCOUNT, ads.map(function(a) { return a.id; }));
}

function undoLastPause() {
  if (!LAST_PAUSED.length) return;
  var ids = LAST_PAUSED.map(function(a) { return a.adId; });
  var btn = document.getElementById('pbUndo');
  if (btn) { btn.disabled = true; btn.textContent = 'Re-enabling…'; }
  google.script.run
    .withSuccessHandler(function(res) {
      if (res && res.ok) {
        var changed = res.changed || [];
        var e = changed.length, s = (res.skipped || []).length;
        // Flip the pills back to Enabled immediately.
        var idx = {};
        (DATA.ads || []).forEach(function(r) { idx[String(r.id)] = r; });
        changed.forEach(function(x) {
          if (idx[x.adId]) idx[x.adId].status = 'ENABLED';
        });
        var note = e + ' re-enabled';
        if (s) note += ', ' + s + ' already enabled';
        if (res.warning) note += ' — ' + res.warning;
        LAST_PAUSED = [];
        toast(note + '. Status updated below.');
      } else {
        toast('Undo failed: ' + ((res && res.error) || 'unknown'));
      }
      render();
    })
    .withFailureHandler(function(e) {
      toast('Undo failed: ' + (e && e.message || e));
      render();
    })
    .enableAds(CURRENT_ACCOUNT, ids);
}

function sparkline() {
  var max = 0;
  DATA.daily.forEach(function(d) { if (d.cost > max) max = d.cost; });
  if (!max) return '';
  return '<div style="margin-top:22px">' +
      '<div class="section-label">Daily spend</div><div class="spark">' +
      DATA.daily.map(function(d) {
        return '<i style="height:' + (d.cost / max * 100) + '%" title="' +
            esc(d.date) + ': ' + money(d.cost) + '"></i>';
      }).join('') + '</div></div>';
}

document.getElementById('note').innerHTML =
    '<b>How to read this.</b> Rates are calculated from raw counters, so totals ' +
    'stay accurate when rows are grouped. Completion rates come from Google per ' +
    'entity; account-level figures are impression-weighted. Google does not ' + 'expose watch depth per video asset, so any funnel marked <em>from ad ' + 'level</em> is inferred from ads carrying exactly one video. View-through ' +
    'conversions are reported separately and sit outside cost per action and ' +
    'ROAS. Videos are rolled up across every ad group they run in. Legacy ' +
    'Demand Gen video ads are not exposed by the API, so their creatives are ' +
    'missing while their spend still appears at campaign level.' +
    (DATA.runLog && DATA.runLog.length
        ? '<br><br><b>Collected:</b> ' + DATA.runLog.map(function(r) {
            return esc(r[0]) + ' — ' + esc(r[1]);
          }).join(' · ')
        : '');

document.getElementById('root').setAttribute('data-mode', APP_MODE);
(function() {
  var topAi = document.getElementById('topAiBtn');
  if (topAi) topAi.onclick = runTopAi;
  // Reflect a previously-run analysis in the button label on load.
  if (window.google && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.ok && res.data) {
          AI_DATA = res.data;
          if (topAi) topAi.textContent = '✨ Re-analyze with AI';
        }
      })
      .withFailureHandler(function() {})
      .getAiAnalysis(CURRENT_ACCOUNT);
  }
})();
if (REPORT_MODE) { ACTIVE = 'clientUpdate'; document.body.classList.add('report-only'); }
buildModeBar();
initWizardAccordion();
drawReadout();
drawSpectrum();
drawMode();
drawKpis();
drawRealImpact();
buildPanels();
buildNav();
buildToolbar();
render();
}
</script>
