// Account-level purchase impact, reconciled to the per-ad numbers. The
// account-level conversion-action rollup (DATA.realImpact / DATA.funnel) is
// preferred when it is populated, but when it comes back empty — which happens
// on some accounts — we fall back to summing the ad-level down-funnel that the
// tables and cards are built from, so the headline always matches what is shown
// right below it instead of reading zero.
function accountImpact() {
  var ri = DATA.realImpact || {};
  var fn = DATA.funnel || {};
  var sum = { spend: 0, orders: 0, vt: 0, revenue: 0, atc: 0, checkout: 0 };
  (DATA.ads || []).forEach(function(a) {
    sum.spend += Number(a.cost) || 0;
    sum.orders += Number(a.orders) || 0;
    sum.vt += Number(a.vtOrders) || 0;
    sum.revenue += Number(a.orderValue) || 0;
    sum.atc += Number(a.atc) || 0;
    sum.checkout += Number(a.checkout) || 0;
  });
  var totalsCost = (DATA.totals && DATA.totals.cost) || 0;
  var rollupOk = (Number(ri.orders) || 0) > 0 || (Number(ri.revenue) || 0) > 0;
  var spend = Number(ri.spend) || totalsCost || sum.spend;
  var orders = rollupOk ? Number(ri.orders) || 0 : sum.orders;
  var vt = rollupOk ? Number(ri.viewThroughOrders) || 0 : sum.vt;
  var revenue = rollupOk ? Number(ri.revenue) || 0 : sum.revenue;
  var checkout = Number(fn.checkout) || sum.checkout;
  var atc = Number(fn.atc) || sum.atc;
  return {
    spend: spend, orders: orders, vt: vt,
    ordersDirect: Math.max(0, orders - vt),
    revenue: revenue, checkout: checkout, atc: atc,
    roas: spend ? revenue / spend : 0,
    cpo: orders ? spend / orders : 0,
    aov: orders ? revenue / orders : 0,
    purchaseAction: ri.purchaseAction || '',
    fromAds: !rollupOk && (sum.orders > 0 || sum.revenue > 0)
  };
}

// --- Client update one-pager ----------------------------------------------
// Everything the client needs in one clean, shareable page: spend, real
// purchases (with and without view-through), CPO/ROAS, begin-checkout pipeline,
// the best and worst ads, which formats and audiences are winning, and an
// editable plan. Built entirely from the pulled data.
var PLAN_KEY = 'client-update-plan';

function cuAds() {
  return (DATA.ads || []).map(function(a) {
    var o = {};
    for (var k in a) o[k] = a[k];
    o.orders = Number(a.orders) || 0;
    o.orderValue = Number(a.orderValue) || 0;
    o.cost = Number(a.cost) || 0;
    o.vtOrders = Number(a.vtOrders) || 0;
    o.atc = Number(a.atc) || 0;
    o.checkout = Number(a.checkout) || 0;
    o.purchaseRoas = Number(a.purchaseRoas) || (o.cost ? o.orderValue / o.cost : 0);
    o.net = (o.orderValue) - (o.cost);
    return o;
  });
}

// Seed the plan from the data so the box is never blank: scale winners, fix or
// cut losers, and lean into the best format/audience. The user edits and it
// saves.
function seedPlan(ctx) {
  var lines = [];
  if (ctx.best.length) {
    lines.push('• Scale the winners: increase budget and creative variants ' +
      'behind ' + ctx.best.slice(0, 3).map(function(a) {
        return '“' + (a.name || 'ad') + '”';
      }).join(', ') + ' — they returned above breakeven ROAS.');
  }
  if (ctx.worst.length) {
    lines.push('• Cut the drag: pause ' + ctx.worst.length + ' ad' +
      (ctx.worst.length === 1 ? '' : 's') + ' that spent with no return, and ' +
      'reallocate that budget to the winners.');
  }
  if (ctx.topFormat) {
    lines.push('• Double down on ' + ctx.topFormat +
      ', the format driving the most efficient volume; test more creative built ' +
      'for it.');
  }
  if (ctx.topAudience) {
    lines.push('• Expand the ' + ctx.topAudience + ' audience and build ' +
      'look-alikes off it — it is converting best.');
  }
  lines.push('• Next: refresh creative on fatigued winners, tighten the ' +
    'landing page, and re-review in two weeks.');
  return lines.join('\n');
}

function cuAdRow(a, kind) {
  var thumb = a.thumb
    ? '<img class="cu-th" src="' + esc(a.thumb) + '" alt="" loading="lazy">'
    : '<span class="cu-th"></span>';
  var roas = a.orders ? roasCell(a.purchaseRoas) : (a.cost ? '0.00x' : '—');
  var meta = [a.adGroup, a.type].filter(Boolean).join(' · ');
  return '<div class="cu-ad ' + kind + '">' + thumb +
    '<div class="cu-ad-b">' +
      '<div class="cu-ad-n">' + esc(a.name || 'Untitled ad') + '</div>' +
      '<div class="cu-ad-m">' + esc(meta) + '</div>' +
    '</div>' +
    '<div class="cu-ad-s">' +
      '<span>' + money(a.cost) + ' spend</span>' +
      '<span>' + int(a.orders) + ' purch · ' + money(a.orderValue) + '</span>' +
      '<span class="cu-roas">' + roas + '</span>' +
    '</div></div>';
}

// Swap in a freshly-pulled payload and re-render every data-driven surface in
// place, so a re-pull updates the page without a reload.
function applyPayload(newData) {
  if (!newData) return;
  DATA = newData;
  NOTES = (function() {
    var base = (DATA && DATA.notes) || {}, out = {};
    for (var k in base) out[k] = base[k];
    for (var f in FRESH_NOTES) out[f] = FRESH_NOTES[f];
    return out;
  })();
  try {
    drawReadout(); drawSpectrum(); drawKpis(); drawRealImpact();
    buildNav(); buildToolbar(); render();
  } catch (e) {}
}

function windowDays(ac) {
  if (!ac || !ac.start || !ac.end) return 0;
  var s = new Date(ac.start + 'T00:00:00'), e = new Date(ac.end + 'T00:00:00');
  var d = Math.round((e - s) / 86400000) + 1; // inclusive
  return d > 0 ? d : 0;
}

function drawClientUpdate() {
  var ac = DATA.account || {};
  var ads = cuAds();
  var imp = accountImpact();
  var days = windowDays(ac);

  var spend = imp.spend;
  var ordersTotal = imp.orders;         // incl. view-through
  var vt = imp.vt;
  var ordersDirect = imp.ordersDirect;  // click / engaged only
  var revenue = imp.revenue;
  var roas = imp.roas;
  var cpo = imp.cpo;
  var aov = imp.aov;
  var checkouts = imp.checkout;
  var checkoutPipe = checkouts * aov;
  var hasPurchase = !!imp.purchaseAction || ordersTotal > 0;

  // Best = ads that turned a profit, most profitable first. Worst = ads that
  // spent past the floor and lost money, biggest loss first.
  var winners = ads.filter(function(a) { return a.orders > 0 && a.net > 0; })
      .sort(function(a, b) { return b.net - a.net; });
  var best = (winners.length ? winners : ads.filter(function(a) {
        return a.orders > 0;
      }).sort(function(a, b) { return b.orderValue - a.orderValue; })).slice(0, 5);
  var worst = ads.filter(function(a) {
        return a.cost >= PAUSE_MIN_SPEND && a.net < 0;
      }).sort(function(a, b) { return a.net - b.net; }).slice(0, 5);

  // Winners-only scenario: if we only ran the net-positive ROAS ads (the ones we
  // recommend keeping), how efficient would the account look? Compared against
  // the same ad-level total so the two rows are apples to apples.
  var keepers = ads.filter(function(a) {
    return a.orders > 0 && (Number(a.purchaseRoas) || 0) >= 1;
  });
  var allS = { spend: 0, orders: 0, rev: 0 };
  ads.forEach(function(a) {
    allS.spend += a.cost; allS.orders += a.orders; allS.rev += a.orderValue;
  });
  var winS = { spend: 0, orders: 0, rev: 0 };
  keepers.forEach(function(a) {
    winS.spend += a.cost; winS.orders += a.orders; winS.rev += a.orderValue;
  });
  allS.roas = allS.spend ? allS.rev / allS.spend : 0;
  allS.cpo = allS.orders ? allS.spend / allS.orders : 0;
  winS.roas = winS.spend ? winS.rev / winS.spend : 0;
  winS.cpo = winS.orders ? winS.spend / winS.orders : 0;
  var wastedSpend = Math.max(0, allS.spend - winS.spend);
  var revKept = allS.rev ? winS.rev / allS.rev : 0;

  // Winning audiences: group the profitable ads by ad group (the audience lives
  // in the ad-group name), most revenue first.
  var byAud = {};
  (winners.length ? winners : best).forEach(function(a) {
    var key = a.adGroup || '—';
    var g = byAud[key] || (byAud[key] = { name: key, revenue: 0, orders: 0 });
    g.revenue += a.orderValue; g.orders += a.orders;
  });
  var audiences = Object.keys(byAud).map(function(k) { return byAud[k]; })
      .sort(function(a, b) { return b.revenue - a.revenue; }).slice(0, 4);

  // Winning formats: the account's format split (Shorts / In-feed / In-stream…)
  // by conversions, falling back to spend.
  var surfaces = (DATA.surfaceMix || []).map(function(s) {
    return { name: s.surface, val: Number(s.conversions) || 0,
             cost: Number(s.cost) || 0, color: s.color || '#8A8F9E' };
  });
  var fmtMetricConv = surfaces.some(function(s) { return s.val > 0; });
  surfaces.forEach(function(s) { if (!fmtMetricConv) s.val = s.cost; });
  surfaces = surfaces.filter(function(s) { return s.val > 0; })
      .sort(function(a, b) { return b.val - a.val; });
  var fmtTotal = surfaces.reduce(function(t, s) { return t + s.val; }, 0);
  var topFormat = surfaces.length ? surfaces[0].name : '';
  var topAudience = audiences.length ? audiences[0].name : '';

  var plan = (NOTES[PLAN_KEY] != null && NOTES[PLAN_KEY] !== '')
      ? NOTES[PLAN_KEY]
      : seedPlan({ best: best, worst: worst, topFormat: topFormat,
                   topAudience: topAudience });

  function kpi(label, value, sub, big) {
    return '<div class="cu-kpi' + (big ? ' big' : '') + '">' +
      '<div class="cu-k">' + esc(label) + '</div>' +
      '<div class="cu-v">' + value + '</div>' +
      (sub ? '<div class="cu-s">' + sub + '</div>' : '') + '</div>';
  }

  if (!spend && !ordersTotal) {
    return '<div class="scroll"><div class="empty">No performance yet for this ' +
      'window. Run <b>Refresh</b> on this account (with a purchase action set in ' +
      'Settings) and the client update fills in automatically.</div></div>';
  }

  // Header
  var head = '<div class="cu-head">' +
    '<div><div class="cu-title">Demand Gen performance update</div>' +
      '<div class="cu-sub">' + esc(ac.name || '') +
      (ac.start ? ' · ' + esc(ac.start) + ' – ' + esc(ac.end) +
        (days ? ' · ' + days + ' days' : '') : '') +
      '</div></div>' +
    '<div class="cu-by">Prepared by<br><b>Lockhern Digital</b></div>' +
  '</div>';

  // AI overview — the narrative summary of the window.
  var ovBullets = (DATA.aiOverview && DATA.aiOverview.bullets) || [];
  var overviewBlock = (ovBullets.length || !REPORT_MODE)
    ? '<div class="cu-overview" id="cuOverview"><div class="cu-h">Overview' +
        (REPORT_MODE ? '' : '<button class="cu-mini" id="cuRegen">↻ Regenerate' +
          '</button>') + '</div>' +
        (ovBullets.length
          ? '<ul class="cu-ov" id="cuOvList">' + ovBullets.map(function(b) {
              return '<li>' + esc(String(b)).replace(/\*\*(.+?)\*\*/g,
                '<b>$1</b>') + '</li>'; }).join('') + '</ul>'
          : '<div class="cu-none" id="cuOvList">No AI overview yet' +
            (REPORT_MODE ? '.' : ' — click Regenerate (needs an Anthropic API ' +
            'key in Script Properties).') + '</div>') +
      '</div>'
    : '';

  // 1–4 headline band
  var roasHtml = '<span style="color:' + (roas >= 1 ? 'var(--up)' : 'var(--down)') +
      '">' + roas.toFixed(2) + 'x</span>';
  var band = '<div class="cu-band">' +
    kpi('Total spend', money(spend), '', true) +
    kpi('Real purchases', int(ordersTotal), 'on the purchase action', true) +
    kpi('Revenue', money(revenue), 'purchases only', true) +
    kpi('ROAS', roasHtml, roas >= 1 ? 'net positive' : 'below breakeven') +
    kpi('Cost / purchase', ordersTotal ? money(cpo) : '—', money(aov) + ' AOV') +
  '</div>';

  // 5 begin-checkout pipeline
  var pipe = '<div class="cu-pipe">' +
    '<div class="cu-pipe-n"><div class="cu-k">Pipeline in Begin Checkout</div>' +
      '<div class="cu-pipe-v">' + int(checkouts) + ' begin-checkouts</div>' +
      '<div class="cu-s">People who started checkout but have not yet ' +
      'purchased — the demand waiting just below the sale.</div></div>' +
    '<div class="cu-pipe-val"><div class="cu-k">Est. pipeline value</div>' +
      '<div class="cu-v">' + (checkoutPipe ? money(checkoutPipe) : '—') + '</div>' +
      '<div class="cu-s">' + int(checkouts) + ' × ' + money(aov) + ' AOV</div>' +
    '</div></div>';

  // 6 best / worst — stacked full-width, top 5 of each
  var perf = '<div class="cu-stack">' +
    '<div class="cu-col"><div class="cu-h">Best performing ads ' +
      '<span class="cu-h-s">top ' + best.length + ' by profit</span></div>' +
      (best.length ? best.map(function(a) { return cuAdRow(a, 'win'); }).join('')
                   : '<div class="cu-none">No profitable ads in this window.</div>') +
    '</div>' +
    '<div class="cu-col"><div class="cu-h">Underperformers to cut ' +
      '<span class="cu-h-s">top ' + worst.length + ' by loss</span></div>' +
      (worst.length ? worst.map(function(a) { return cuAdRow(a, 'lose'); }).join('')
                    : '<div class="cu-none">Nothing spending above ' +
                      money(PAUSE_MIN_SPEND) + ' at a loss. </div>') +
    '</div></div>';

  // 6b winners-only scenario: how efficient the account looks if we run only the
  // net-positive ROAS ads.
  function scoreRow(label, s, cls) {
    var roasTxt = '<span style="color:' +
      (s.roas >= 1 ? 'var(--up)' : 'var(--down)') + ';font-weight:700">' +
      s.roas.toFixed(2) + 'x</span>';
    return '<tr class="' + (cls || '') + '"><td class="cu-sc-l">' + label +
      '</td><td>' + money(s.spend) + '</td><td>' + int(s.orders) +
      '</td><td>' + money(s.rev) + '</td><td>' + roasTxt + '</td><td>' +
      (s.orders ? money(s.cpo) : '—') + '</td></tr>';
  }
  var scenario = keepers.length ? (
    '<div class="cu-sech">If we only ran the winners</div>' +
    '<div class="cu-col cu-scenario">' +
      '<div class="cu-h">Keep only the net-positive ROAS ads ' +
        '<span class="cu-h-s">' + keepers.length + ' ad' +
        (keepers.length === 1 ? '' : 's') + ' with ROAS ≥ 1x</span></div>' +
      '<div class="cu-sc-wrap"><table class="cu-sc"><thead><tr>' +
        '<th></th><th>Spend</th><th>Purchases</th><th>Revenue</th>' +
        '<th>ROAS</th><th>Cost / purch.</th></tr></thead><tbody>' +
        scoreRow('All ads today', allS, '') +
        scoreRow('Winners only', winS, 'cu-sc-win') +
      '</tbody></table></div>' +
      '<div class="cu-sc-note">Cutting the rest removes <b>' +
        money(wastedSpend) + '</b> of spend that returned below breakeven, ' +
        'keeps <b>' + pct0(revKept) + '</b> of the revenue, and lifts blended ' +
        'ROAS from <b>' + allS.roas.toFixed(2) + 'x</b> to <b>' +
        winS.roas.toFixed(2) + 'x</b>' +
        (allS.cpo && winS.cpo ? ' while cutting cost per purchase from <b>' +
          money(allS.cpo) + '</b> to <b>' + money(winS.cpo) + '</b>' : '') +
        '.</div>' +
    '</div>'
  ) : '';

  // 7 winning segments
  var fmtBars = surfaces.slice(0, 5).map(function(s) {
    var wpct = fmtTotal ? Math.round(s.val / fmtTotal * 100) : 0;
    return '<div class="cu-bar-row"><span class="cu-bar-n">' + esc(s.name) +
      '</span><span class="cu-bar-t"><i style="width:' + wpct + '%;background:' +
      s.color + '"></i></span><span class="cu-bar-p">' + wpct + '%</span></div>';
  }).join('') || '<div class="cu-none">No format split reported.</div>';

  var audRows = audiences.length ? audiences.map(function(g) {
    return '<div class="cu-aud"><span class="cu-aud-n">' + esc(g.name) +
      '</span><span class="cu-aud-v">' + money(g.revenue) + ' · ' +
      int(g.orders) + ' purch</span></div>';
  }).join('') : '<div class="cu-none">Audience is read from ad-group names; ' +
    'none of the winners carry one.</div>';

  var seg = '<div class="cu-cols">' +
    '<div class="cu-col"><div class="cu-h">Winning formats ' +
      '<span class="cu-h-s">Shorts vs in-feed vs in-stream</span></div>' +
      fmtBars + '</div>' +
    '<div class="cu-col"><div class="cu-h">Winning audiences ' +
      '<span class="cu-h-s">by ad group</span></div>' + audRows + '</div>' +
  '</div>';

  // 8 plan (editable)
  var planBlock = '<div class="cu-plan">' +
    '<div class="cu-h">What we are going to do with this ' +
      '<span class="note-state" id="ns-' + PLAN_KEY + '"></span></div>' +
    '<textarea class="cu-plan-t" id="cuPlan" data-key="' + PLAN_KEY +
      '" rows="6">' + esc(plan) + '</textarea>' +
    '<div class="cu-plan-print" id="cuPlanPrint">' + esc(plan) + '</div>' +
    '<div class="cu-plan-h">Edit freely — this saves automatically and is ' +
      'yours to send.</div>' +
  '</div>';

  var toolbar = REPORT_MODE ? '' : '<div class="cu-actions">' +
    '<button class="pb-btn" id="cuPrint">🖨 Print / Save as PDF</button>' +
    '<button class="pb-btn ghost" id="cuShare">🔗 Share report link</button>' +
    '<span class="cu-window">Window ' +
      '<select id="cuDays">' +
        [7, 14, 30, 60, 90, 180, 365].map(function(d) {
          return '<option value="' + d + '"' + (d === days ? ' selected' : '') +
            '>' + d + ' days</option>';
        }).join('') +
        (([7,14,30,60,90,180,365].indexOf(days) === -1 && days)
          ? '<option value="' + days + '" selected>' + days + ' days</option>' : '') +
      '</select>' +
      '<label class="cu-check"><input type="checkbox" id="cuPaused"' +
        ((ac.includePaused === false) ? '' : ' checked') +
        '> incl. paused</label>' +
      '<button class="pb-btn ghost" id="cuRepull">Apply &amp; re-pull</button>' +
      '<span id="cuRepullState" class="cu-note"></span>' +
    '</span>' +
    (hasPurchase ? '' : '<span class="cu-warn">No purchase action set in ' +
      'Settings — purchase numbers will read 0 until you pick one.</span>') +
    (imp.fromAds ? '<span class="cu-note">Figures totalled from the ad ' +
      'breakdown. Re-run the pull to get the account-level rollup.</span>' : '') +
  '</div>';

  return '<div class="scroll">' + toolbar +
    '<div class="cu-report" id="cuReport">' + head + band + pipe +
    overviewBlock +
    '<div class="cu-sech">Best &amp; worst creative</div>' + perf +
    scenario +
    '<div class="cu-sech">What is working</div>' + seg +
    planBlock + '</div></div>';
}

function bindClientUpdate() {
  var area = document.getElementById('cuPlan');
  if (area) {
    var timer = null;
    area.addEventListener('input', function() {
      NOTES[PLAN_KEY] = area.value;
      var mirror = document.getElementById('cuPlanPrint');
      if (mirror) mirror.textContent = area.value;
      var st = document.getElementById('ns-' + PLAN_KEY);
      if (st) { st.textContent = 'saving…'; st.style.color = 'var(--muted)';
        st.className = 'note-state show'; }
      if (timer) clearTimeout(timer);
      timer = setTimeout(function() {
        saveNoteToServer(PLAN_KEY, area.value);
      }, 700);
    });
  }
  var pr = document.getElementById('cuPrint');
  if (pr) pr.onclick = function() {
    var mirror = document.getElementById('cuPlanPrint');
    if (mirror && area) mirror.textContent = area.value;
    document.body.classList.add('printing-cu');
    window.print();
    setTimeout(function() {
      document.body.classList.remove('printing-cu');
    }, 500);
  };

  var repull = document.getElementById('cuRepull');
  if (repull) repull.onclick = function() {
    var sel = document.getElementById('cuDays');
    var pausedBox = document.getElementById('cuPaused');
    var state = document.getElementById('cuRepullState');
    var days = Number(sel && sel.value) || 0;
    var includePaused = pausedBox ? !!pausedBox.checked : true;
    if (!days) return;
    if (!window.confirm('Re-pull ' + (DATA.account && DATA.account.name || 'this ' +
        'account') + ' over the last ' + days + ' days (' + (includePaused
        ? 'enabled + paused' : 'enabled only') + ')? This runs the live queries ' +
        'again and can take a minute.')) return;
    repull.disabled = true;
    repull.textContent = 'Pulling…';
    if (state) { state.textContent = 'Running the ' + days + '-day pull…';
      state.style.color = 'var(--muted)'; }
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.ok) {
          if (state) { state.textContent = 'Loading fresh data…';
            state.style.color = 'var(--muted)'; }
          // Re-render in place from the freshly-saved payload — the sandboxed
          // iframe cannot reliably reload its own top window.
          google.script.run
            .withSuccessHandler(function(p) {
              repull.disabled = false;
              repull.textContent = 'Apply & re-pull';
              if (p) {
                applyPayload(p);
                toast('Updated: ' + res.start + ' – ' + res.end);
              } else if (state) {
                state.textContent = 'Pulled, but could not reload — refresh the ' +
                  'page.'; state.style.color = 'var(--down)';
              }
            })
            .withFailureHandler(function() {
              repull.disabled = false;
              repull.textContent = 'Apply & re-pull';
              if (state) { state.textContent = 'Pulled — refresh the page to see ' +
                'it.'; state.style.color = 'var(--muted)'; }
            })
            .getPayload(CURRENT_ACCOUNT);
        } else {
          repull.disabled = false;
          repull.textContent = 'Apply & re-pull';
          if (state) { state.textContent = (res && res.error) || 'Pull failed.';
            state.style.color = 'var(--down)'; }
        }
      })
      .withFailureHandler(function(e) {
        repull.disabled = false;
        repull.textContent = 'Apply & re-pull';
        if (state) { state.textContent = 'Pull failed: ' + (e && e.message || e);
          state.style.color = 'var(--down)'; }
      })
      .repullAccountDays(CURRENT_ACCOUNT, days, includePaused);
  };

  var share = document.getElementById('cuShare');
  if (share) share.onclick = function() {
    var base = (typeof BASE_URL !== 'undefined' && BASE_URL) ? BASE_URL : '';
    if (!base) { toast('No web-app URL available.'); return; }
    var url = base + (base.indexOf('?') === -1 ? '?' : '&') + 'account=' +
      encodeURIComponent(CURRENT_ACCOUNT) + '&report=1';
    function done() { toast('Report link copied — anyone with it sees this ' +
      'report, read-only.'); }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(done, function() {
          window.prompt('Copy this report link:', url);
        });
      } else {
        window.prompt('Copy this report link:', url);
      }
    } catch (e) { window.prompt('Copy this report link:', url); }
  };

  var regen = document.getElementById('cuRegen');
  if (regen) regen.onclick = function() {
    var list = document.getElementById('cuOvList');
    regen.disabled = true; regen.textContent = 'Writing…';
    if (list) list.innerHTML = '<li>Generating…</li>';
    google.script.run
      .withSuccessHandler(function(res) {
        regen.disabled = false; regen.textContent = '↻ Regenerate';
        if (res && res.ok) {
          DATA.aiOverview = { bullets: res.bullets || [] };
          drawReadout();
          render();  // re-render the report with the fresh overview
        } else {
          if (list) list.outerHTML = '<div class="cu-none" id="cuOvList">' +
            esc((res && res.error) || 'Could not generate.') + '</div>';
        }
      })
      .withFailureHandler(function(e) {
        regen.disabled = false; regen.textContent = '↻ Regenerate';
        if (list) list.outerHTML = '<div class="cu-none" id="cuOvList">' +
          esc('Failed: ' + (e && e.message || e)) + '</div>';
      })
      .regenerateOverview(CURRENT_ACCOUNT);
  };
}

// --- KPIs -----------------------------------------------------------------
function drawKpis() {
  var t = DATA.totals, p = DATA.prior, k = K();
  var items = [
    ['Spend', money(t.cost), 'cost', true],
    ['Impressions', int(t.impressions), 'impressions', false],
    ['Clicks', int(t.clicks), 'clicks', false],
    ['Click rate', pct(t.ctr), 'ctr', false],
    ['Cost per click', money(t.cpc), 'cpc', true],
    ['Cost per 1,000', money(t.cpm), 'cpm', true],
    [k.word, dec(t[k.conv]), k.conv, false],
    ['Conv. rate', pct(t[k.cvr]), k.cvr, false],
    ['Cost per action', t[k.conv] ? money(t[k.cpa]) : '—', k.cpa, true],
    ['Return on spend', t.cost ? dec(t[k.roas]) + 'x' : '—', k.roas, false],
    ['View-through conv.', int(t.viewThrough), 'viewThrough', false],
    ['Video views', int(t.videoViews), 'videoViews', false],
    ['View rate', pct(t.viewRate), 'viewRate', false],
    ['Watched in full', pct(t.p100), 'p100', false]
  ];

  document.getElementById('kpis').innerHTML = items.map(function(item) {
    var delta = '';
    if (p && p[item[2]]) {
      var change = (t[item[2]] - p[item[2]]) / p[item[2]];
      var good = item[3] ? change < 0 : change > 0;
      var cls = Math.abs(change) < 0.005 ? 'flat' : (good ? 'up' : 'down');
      delta = '<div class="delta ' + cls + '">' + (change >= 0 ? '+' : '') +
          (change * 100).toFixed(0) + '% vs prior</div>';
    }
    return '<div class="kpi"><div class="label">' + item[0] + '</div>' +
        '<div class="value">' + item[1] + '</div>' + delta + '</div>';
  }).join('');
}

// --- videos ---------------------------------------------------------------
function videoStats() {
  var vids = DATA.videos || [];
  var k = K();
  var cpas = vids.filter(function(v) { return v[k.conv] > 0; })
      .map(function(v) { return v[k.cpa]; })
      .sort(function(a, b) { return a - b; });
  var comps = vids.map(function(v) { return v.p100 || 0; })
      .sort(function(a, b) { return a - b; });
  return {
    medianCpa: cpas.length ? cpas[Math.floor(cpas.length / 2)] : 0,
    medianComp: comps.length ? comps[Math.floor(comps.length / 2)] : 0
  };
}

var VIDEO_FILTERS = [
  ['all', 'All videos'],
  ['starred', 'Starred'],
  ['best', 'Rated Best'],
  ['efficient', 'Beats median cost'],
  ['completion', 'Holds attention'],
  ['none', 'No conversions']
];

function videoPasses(v) {
  var k = K(), s = videoStats();
  if (VIDEO_FILTER === 'starred') return !!LABELS[v.id];
  if (VIDEO_FILTER === 'best') return v.label === 'Best';
  if (VIDEO_FILTER === 'efficient') {
    return v[k.conv] > 0 && s.medianCpa > 0 && v[k.cpa] <= s.medianCpa;
  }
  if (VIDEO_FILTER === 'completion') {
    return (v.p100 || 0) > 0 && v.p100 >= s.medianComp;
  }
  if (VIDEO_FILTER === 'none') return !v[k.conv];
  return true;
}

function drawVideos(term) {
  var k = K();
  var all = DATA.videos || [];
  var rows = all.filter(function(v) {
    return videoPasses(v) &&
        (!PROFIT_ONLY || (Number(v.purchaseRoas) || 0) >= 1) &&
        (!term || String(v.title).toLowerCase().indexOf(term) !== -1);
  });

  rows.sort(function(a, b) {
    if (VIDEO_SORT === 'cpa') {
      var x = a[k.conv] ? a[k.cpa] : Infinity;
      var y = b[k.conv] ? b[k.cpa] : Infinity;
      return x - y;
    }
    var key = VIDEO_SORT === 'conv' ? k.conv : VIDEO_SORT;
    return (b[key] || 0) - (a[key] || 0);
  });

  document.getElementById('count').textContent =
      rows.length + ' of ' + all.length + ' videos';

  if (!all.length) {
    return '<div class="scroll"><div class="empty">No video assets returned. ' +
        'If this account runs image-only Demand Gen ads, that is expected — ' +
        'check the Assets tab instead.</div></div>';
  }
  if (!rows.length) {
    var vwhy = (PROFIT_ONLY
        ? 'No video turned a real profit in this window. Turn off "Profitable ' +
          'only" to see every creative.'
        : 'No videos match this filter.');
    return '<div class="scroll"><div class="empty">' + vwhy + '</div></div>';
  }

  return '<div class="videos">' + rows.map(function(v) {
    var starred = !!LABELS[v.id];
    // Not every video has an mqdefault image, so ship a fallback chain and
    // let bindThumbs walk it on error rather than showing a broken frame.
    var shot = v.videoId
        ? '<img src="https://i.ytimg.com/vi/' + esc(v.videoId) +
          '/mqdefault.jpg" data-yt="' + esc(v.videoId) + '" data-step="0" ' +
          'alt="Thumbnail for ' + esc(v.title) + '" loading="lazy">' +
          '<button class="play" data-play="' + esc(v.videoId) + '" ' +
          'title="Play here" aria-label="Play ' + esc(v.title) +
          ' without leaving the page">\u25B6</button>'
        : '<div class="none">No YouTube ID returned</div>';
    var ratingCls = v.label === 'Best' ? 'best' : (v.label === 'Low' ? 'low' : '');
    var rating = v.label
        ? '<span class="rating ' + ratingCls + '">' + esc(v.label) + '</span>' : '';
    var starBtn = CAN_LABEL
        ? '<button class="star" data-video="' + esc(v.id) + '" aria-pressed="' +
          starred + '" title="Star this video">' +
          (starred ? '\u2605' : '\u2606') + '</button>'
        : '';

    var ticks = ['25%', '50%', '75%', 'End'];
    var funnel = ['p25', 'p50', 'p75', 'p100'].map(function(q, i) {
      return '<div class="row"><span class="tick">' + ticks[i] + '</span>' +
          '<span class="track"><span class="fill" style="width:' +
          Math.min(100, (v[q] || 0) * 100) + '%"></span></span>' +
          '<span class="pctv">' + pct0(v[q]) + '</span></div>';
    }).join('');

    var vwin = (Number(v.purchaseRoas) || 0) >= 1;
    return '<div class="video' + (vwin ? ' win' : '') + '">' +
      '<div class="shot">' + shot + starBtn + rating + '</div>' +
      '<div class="body">' +
        '<h3>' + esc(v.title) + '</h3>' +
        '<div class="where">' + v.adGroupCount + ' ad group' +
          (v.adGroupCount === 1 ? '' : 's') + ' · ' +
          esc((v.campaignList || []).join(', ')) + '</div>' +
        '<div class="stats">' +
          '<div class="stat"><div class="k">Spend</div><div class="v">' +
            money(v.cost) + '</div></div>' +
          '<div class="stat"><div class="k">' + k.word + '</div><div class="v">' +
            dec(v[k.conv]) + '</div></div>' +
          '<div class="stat"><div class="k">Per action</div><div class="v">' +
            (v[k.conv] ? money(v[k.cpa]) : '—') + '</div></div>' +
          '<div class="stat"><div class="k">View rate</div><div class="v">' +
            pct0(v.viewRate) + '</div></div>' +
        '</div>' +
        ((v.orders || v.orderValue || v.atc || v.checkout || v.vtOrders)
          ? '<div class="stats down"><div class="stat"><div class="k">Purchases</div>' +
            '<div class="v">' + dec(v.orders || 0) + '</div></div>' +
            '<div class="stat"><div class="k">View-thru purch.</div><div class="v">' +
            dec(v.vtOrders || 0) + '</div></div>' +
            '<div class="stat"><div class="k">Revenue</div><div class="v">' +
            money(v.orderValue || 0) + '</div></div>' +
            '<div class="stat"><div class="k">Net profit</div><div class="v">' +
            netCell((v.orderValue || 0) - (v.cost || 0)) + '</div></div>' +
            '<div class="stat"><div class="k">CPO</div><div class="v">' +
            (v.orders ? money(v.cpo) : '—') + '</div></div>' +
            '<div class="stat"><div class="k">Purch. ROAS</div><div class="v">' +
            (v.orders ? roasCell(Number(v.purchaseRoas) || 0)
                      : (v.cost ? '0.00x' : '—')) +
            '</div></div></div>'
          : '') +
        ((v.p25 || v.p100)
          ? '<div class="funnel"><div class="head"><span>How far people watch' +
            (v.quartileSource === 'ad' ? ' <em>(from its ad)</em>' : '') +
            '</span><span class="num">' + int(v.videoViews) + ' views</span>' +
            '</div>' + funnel + '</div>'
          : '<div class="nodepth">Watch depth isn\u2019t reported per video' +
            (v.depthNote === 'shared-ad'
              ? '. This creative shares an ad with others, and that ad reports ' +
                'one blended rate across all of them.'
              : ' for this creative.') +
            ' The view rate above is measured.</div>') +
        convBlock(v, k) +
        '<div class="foot">' +
          (v.url
            ? '<a href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
              'Watch on YouTube</a>'
            : '<span style="color:var(--down)">Asset ' + esc(v.id) +
              ' — no YouTube link</span>') +
          '<span style="color:var(--muted)">' + int(v.impressions) +
            ' impressions</span>' +
        '</div>' +
      '</div></div>';
  }).join('') + '</div>';
}

/** Conversion actions for one video, collapsed by default to keep cards scannable. */
function convBlock(v, k) {
  var actions = v.conversionActions || [];
  if (!actions.length) return '';
  var inferred = v.conversionSource === 'ad';

  return '<details class="convs"><summary>Conversion actions (' +
      actions.length + ')' + (inferred ? ' — inferred' : '') + '</summary>' +
      '<table><tbody>' + actions.map(function(a) {
        return '<tr><td>' + esc(a.action) +
            (a.category ? '<span class="meta">' + esc(a.category) + '</span>' : '') +
            '</td><td class="num">' + dec(a.allConversions) + '</td>' +
            '<td class="num">' + (a.allConvValue ? money(a.allConvValue) : '—') +
            '</td></tr>';
      }).join('') + '</tbody></table></details>';
}

/** Walks the YouTube thumbnail sizes until one loads. */
function bindThumbs() {
  var sizes = ['mqdefault', 'hqdefault', '0'];
  var imgs = document.querySelectorAll('.shot img[data-yt]');
  for (var i = 0; i < imgs.length; i++) {
    imgs[i].onerror = function() {
      var step = Number(this.getAttribute('data-step')) + 1;
      if (step >= sizes.length) {
        this.onerror = null;
        this.style.display = 'none';
        return;
      }
      this.setAttribute('data-step', String(step));
      this.src = 'https://i.ytimg.com/vi/' + this.getAttribute('data-yt') +
          '/' + sizes[step] + '.jpg';
    };
  }
}

/** Swaps the still for an inline player so review never leaves the page. */
function bindPlays() {
  var buttons = document.querySelectorAll('.play');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function() {
      var id = this.getAttribute('data-play');
      this.parentNode.innerHTML =
          '<iframe src="https://www.youtube-nocookie.com/embed/' +
          encodeURIComponent(id) + '?autoplay=1&rel=0" ' +
          'allow="autoplay; encrypted-media; fullscreen" ' +
          'allowfullscreen title="Video preview"></iframe>';
    };
  }
}

function bindStars() {
  var buttons = document.querySelectorAll('.star');
  for (var i = 0; i < buttons.length; i++) {
    buttons[i].onclick = function() {
      var id = this.getAttribute('data-video');
      if (LABELS[id]) {
        delete LABELS[id];
      } else {
        LABELS[id] = true;
      }
      this.setAttribute('aria-pressed', String(!!LABELS[id]));
      this.textContent = LABELS[id] ? '\u2605' : '\u2606';
      persistLabels();
      if (VIDEO_FILTER === 'starred') render();
    };
  }
}

var saveTimer = null;
function persistLabels() {
  if (!CAN_LABEL) return;
  clearTimeout(saveTimer);
  saveTimer = setTimeout(function() {
    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      toast('Stars kept for this session only');
      return;
    }
    google.script.run
        .withSuccessHandler(function() { toast('Stars saved'); })
        .withFailureHandler(function() { toast('Could not save stars'); })
        .saveLabels(JSON.stringify(LABELS));
  }, 600);
}

// --- tables ---------------------------------------------------------------
// Purchase ROAS cell: green and bold when net positive (>= 1, revenue beats
// spend), red when it earned orders but stayed under 1, dash when no orders.
function roasCell(v) {
  if (!v) return '—';
  var s = dec(v) + 'x';
  if (v >= 1) return '<span style="color:var(--up);font-weight:700">' + s + '</span>';
  return '<span style="color:var(--down)">' + s + '</span>';
}

// Net profit = purchase revenue - spend. Green when the creative paid for
// itself, red when it lost money. This is the ROI-positive signal.
function netCell(v) {
  if (v === undefined || v === null || v === 0) return '—';
  var s = (v > 0 ? '+' : '−') + money(Math.abs(v));
  if (v > 0) return '<span style="color:var(--up);font-weight:700">' + s + '</span>';
  return '<span style="color:var(--down)">' + s + '</span>';
}

// The ad's live serving status as a small pill: green Enabled, muted Paused,
// red for anything removed.
function statusCell(v) {
  var s = String(v || '').toUpperCase();
  var label = s === 'ENABLED' ? 'Enabled'
      : s === 'PAUSED' ? 'Paused'
      : s ? s.charAt(0) + s.slice(1).toLowerCase() : '—';
  var cls = s === 'ENABLED' ? 'on' : s === 'PAUSED' ? 'off' : 'gone';
  return '<span class="pill ' + cls + '">' + label + '</span>';
}

function perfColumns(view) {
  var k = K();
  // The Ads table is the profit ledger: real purchase economics first, no
  // horizontal scroll. Winners (revenue >= spend) sort and color to the top.
  if (view === 'ads') {
    return [
      { key: 'status', label: 'Status', fmt: statusCell },
      { key: 'cost', label: 'Spend', fmt: money },
      { key: 'orders', label: 'Purch.', fmt: dec },
      { key: 'vtOrders', label: 'View-thru purch.', fmt: dec },
      { key: 'orderValue', label: 'Revenue', fmt: money },
      { key: 'netProfit', label: 'Net profit', fmt: netCell },
      { key: 'cpo', label: 'CPO',
        fmt: function(v) { return v ? money(v) : '—'; } },
      { key: 'purchaseRoas', label: 'ROAS', fmt: roasCell }
    ];
  }
  return [
    { key: 'impressions', label: 'Impr.', fmt: int },
    { key: 'clicks', label: 'Clicks', fmt: int },
    { key: 'cost', label: 'Spend', fmt: money },
    { key: 'ctr', label: 'CTR', fmt: pct },
    { key: 'cpc', label: 'CPC', fmt: money },
    { key: 'cpm', label: 'CPM', fmt: money },
    { key: k.conv, label: k.word, fmt: dec },
    { key: k.cvr, label: 'Conv. rate', fmt: pct },
    { key: k.cpa, label: 'Per action', fmt: money },
    { key: k.roas, label: 'ROAS', fmt: function(v) { return dec(v) + 'x'; } },
    { key: 'viewThrough', label: 'View-thru', fmt: int },
    { key: 'videoViews', label: 'Views', fmt: int },
    { key: 'viewRate', label: 'View rate', fmt: pct },
    { key: 'p100', label: 'Watched in full', fmt: pct }
  ];
}

function adCell(row) {
  var thumb = row.thumb
      ? '<img class="thumb" src="' + esc(row.thumb) + '" alt="" loading="lazy">'
      : '<span class="thumb"></span>';
  var links = [];
  (row.videoLinks || []).forEach(function(v, i) {
    links.push('<a href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
        'Video ' + (i + 1) + '</a>');
  });
  (row.imageUrls || []).forEach(function(u, i) {
    links.push('<a href="' + esc(u) + '" target="_blank" rel="noopener">' +
        'Image ' + (i + 1) + '</a>');
  });
  if (row.finalUrl) {
    links.push('<a href="' + esc(row.finalUrl) + '" target="_blank" ' +
        'rel="noopener">Landing page</a>');
  }

  var mixTotal = 0;
  for (var key in (row.channelMix || {})) mixTotal += row.channelMix[key];
  var mix = '';
  if (mixTotal > 0) {
    mix = '<div class="mix" title="Channel mix by spend">';
    DATA.channelMix.forEach(function(c) {
      var v = (row.channelMix || {})[c.channel] || 0;
      if (v > 0) {
        mix += '<i style="background:' + c.color + ';width:' +
            (v / mixTotal * 100) + '%"></i>';
      }
    });
    mix += '</div>';
  }

  return '<div class="row-flex">' + thumb + '<div><strong>' + esc(row.name) +
      '</strong><span class="meta">' + esc(row.type) + ' · ' +
      esc(row.campaign) + ' › ' + esc(row.adGroup) +
      (row.approval && row.approval !== 'Approved'
          ? ' · <span style="color:var(--down)">' + esc(row.approval) + '</span>'
          : '') + '</span>' +
      (links.length ? '<div class="linkrow">' + links.join('') + '</div>' : '') +
      mix + '</div></div>';
}

// Campaign settings the Google Ads API does not reliably expose. The auditor
// verifies them in-platform and records the value here; it saves to the audit
// and flows into the deck.
var CAMPAIGN_REVIEW_FIELDS = [
  ['viewThroughOpt', 'View-through conversion optimization'],
  ['productFeeds', 'Product feeds'],
  ['devices', 'Device targeting'],
  ['gdn', 'Google Display Network'],
  ['thirdParty', 'Third-party measurement'],
  ['ipExclusions', 'IP exclusions'],
  ['urlOptions', 'Campaign URL options'],
  ['brandGuidelines', 'Brand guidelines']
];

function ovrGet(key) { return OVERRIDES[key] || ''; }

/** Persist an override and show a tiny saved/failed state. */
function ovrSet(key, value, stateId) {
  value = String(value || '');
  if (value) OVERRIDES[key] = value; else delete OVERRIDES[key];
  var el = stateId ? document.getElementById(stateId) : null;
  function show(msg, cls) {
    if (!el) return;
    el.textContent = msg; el.style.color = cls; el.className = 'ovr-state show';
    if (cls === 'var(--up)') setTimeout(function() {
      el.className = 'ovr-state'; }, 1200);
  }
  show('saving…', 'var(--muted)');
  try {
    if (window.google && google.script && google.script.run) {
      google.script.run
          .withSuccessHandler(function() { show('saved', 'var(--up)'); })
          .withFailureHandler(function() { show('not saved', 'var(--down)'); })
          .saveOverride(key, value);
    } else { show('preview only', 'var(--down)'); }
  } catch (e) { show('not saved', 'var(--down)'); }
}

function campaignGoal(c) {
  return /value|roas/i.test((c.bidding || '') + ' ' + (c.target || ''))
      ? 'Conversion value' : 'Conversions';
}

/** A three-state asset-toggle row: detected badge + On/Off/As-detected select. */
function toggleRow(c, a) {
  var key = c.id + '|asset|' + a.type;
  var ov = ovrGet(key);
  var eff = ov || (a.verified ? (a.on ? 'on' : 'off') : 'review');
  var badge = ov
      ? '<span class="pill-manual">' + (ov === 'on' ? 'ON' : 'OFF') +
        ' · manual</span>'
      : eff === 'on' ? '<span class="flagpill on">ON</span>'
      : eff === 'off' ? '<span class="flagpill off">OFF</span>'
      : '<span class="pill-review">Review</span>';
  var sid = 'st-' + key;
  var sel = '<select class="ovr" data-key="' + esc(key) + '" data-state="' +
      esc(sid) + '">' +
      '<option value="">' + (a.verified ? 'As detected' : 'Set…') + '</option>' +
      '<option value="on"' + (ov === 'on' ? ' selected' : '') + '>On</option>' +
      '<option value="off"' + (ov === 'off' ? ' selected' : '') + '>Off</option>' +
      '</select><span class="ovr-state" id="' + esc(sid) + '"></span>';
  return '<div class="togrow"><span class="tn">' + esc(a.name) + '</span>' +
      '<span class="tc">' + badge + sel + '</span></div>';
}

function reviewBox(c) {
  return '<div class="reviewbox"><div class="rb-title">Verify in platform</div>' +
    '<div class="rb-sub">Google’s API doesn’t expose these. Open the campaign ' +
    'in Google Ads, record the value here — it saves to the audit and flows ' +
    'into the deck.</div>' +
    CAMPAIGN_REVIEW_FIELDS.map(function(f) {
      var key = c.id + '|' + f[0];
      var val = ovrGet(key);
      var sid = 'st-' + key;
      return '<div class="revrow"><span class="rk">' + esc(f[1]) + '</span>' +
        '<span>' + (val ? '<span class="pill-manual">set</span> '
                        : '<span class="pill-review">Review</span> ') +
        '<input class="ovrtext" type="text" data-key="' + esc(key) +
        '" data-state="' + esc(sid) + '" value="' + esc(val) +
        '" placeholder="Set from platform…"><span class="ovr-state" id="' +
        esc(sid) + '"></span></span></div>';
    }).join('') + '</div>';
}

function drawSettings() {
  var settings = DATA.settings;
  var packing = DATA.creativePacking;
  document.getElementById('count').textContent =
      ((settings || {}).campaigns || []).length + ' campaigns';

  if (!settings || !(settings.campaigns || []).length) {
    return '<div class="scroll"><div class="empty">No settings returned. Run ' +
        'refresh to pull them.</div></div>';
  }

  var out = '';

  if (packing && packing.multiVideoAds) {
    out += '<div class="warnbox"><strong>' + packing.multiVideoAds + ' ad' +
      (packing.multiVideoAds === 1 ? '' : 's') + ' carr' +
      (packing.multiVideoAds === 1 ? 'ies' : 'y') + ' more than one video</strong>' +
      ' — up to ' + packing.maxVideosInOneAd + ' in a single ad, affecting ' +
      packing.videosAffected + ' video' +
      (packing.videosAffected === 1 ? '' : 's') + '. Google reports one blended ' +
      'watch-depth figure per ad, so none of those videos can be measured ' +
      'individually. Building one ad per video costs nothing in delivery and ' +
      'recovers completion rate and isolated conversion data for each creative.' +
      '</div>';
  }

  var gt = ovrGet('settingsGroundTruth');
  out += '<div class="gtbox"><div class="rb-title">Ground truth: paste or ' +
    'screenshot your settings</div><div class="rb-sub">The API can’t read every ' +
    'Demand Gen setting, and sometimes reads one wrong (e.g. conversion goals), ' +
    'and it usually can’t see the exclusion inside an ad-group audience signal ' +
    '(such as excluding past purchasers). Paste the campaign and ad-group ' +
    'settings, and the ad-group audience with its exclusions, copied from Google ' +
    'Ads here. Or when you build the deck, just drag those screenshots into the ' +
    'Claude chat. Either one overrides the audit and flows into the deck as the ' +
    'source of truth.</div><textarea class="gt-paste" data-key="settingsGroundTruth" ' +
    'data-state="st-gt" placeholder="Paste settings copied from Google Ads…">' +
    esc(gt) + '</textarea><span class="ovr-state" id="st-gt"></span></div>';

  out += '<div class="subhead">Campaign settings</div>';
  out += '<div class="setgrid">' + settings.campaigns.map(function(c) {
    function row(key, value, flag) {
      return '<div class="setrow"><span class="k">' + esc(key) + '</span>' +
          '<span class="v">' + value +
          (flag ? '<span class="flagpill ' + flag[0] + '">' + esc(flag[1]) +
              '</span>' : '') + '</span></div>';
    }
    var schedule = (c.schedule || []).length
        ? c.schedule.map(function(s) {
            var day = String(s.day || '');
            return day.charAt(0) + day.slice(1, 3).toLowerCase() + ' ' +
                s.start + '\u2013' + s.end;
          }).join(', ')
        : 'All day, every day';
    var acquisitionFlag = /only|higher/i.test(c.acquisition)
        ? ['on', 'set'] : ['off', 'default'];

    return '<div class="setcard"><h3>' + esc(c.name) + '</h3>' +
      '<div class="sub">' + esc(c.status) + ' \u00b7 since ' +
        esc(c.startDate || 'unknown') + '</div>' +
      row('Bidding', esc(c.bidding) + (c.target ? ' \u00b7 ' + esc(c.target) : '')) +
      row('Daily budget', money(c.budget) +
          (c.budgetShared ? ' (shared)' : '')) +
      row('Delivery', esc(c.budgetDelivery || '—')) +
      row('New vs existing', esc(c.acquisition), acquisitionFlag) +
      row('Campaign goal', esc(campaignGoal(c))) +
      row('Conversion goals', esc((c.goals || []).join(', ') ||
          'Account default')) +
      (c.spend ? row('Spend (this window)', money(c.spend)) : '') +
      row('Ad schedule', esc(schedule),
          (c.schedule || []).length ? ['on', 'restricted'] : null) +
      (c.targetingAtAdGroup
        ? row('Location & language', '<span style="color:var(--muted)">Set ' +
            'at ad group — see Ad group settings</span>', ['on', 'ad group'])
        : row('Locations', esc((c.locations || []).slice(0, 3).join(', ') ||
              'All locations') + ((c.locations || []).length > 3
                  ? ' +' + (c.locations.length - 3) : '')) +
          row('Excluded locations',
              esc((c.excludedLocations || []).join(', ') || 'None')) +
          row('Languages', esc((c.languages || []).join(', ') || 'All'))) +
      row('Excluded audiences',
          esc((c.excludedAudiences || []).join(', ') || 'None'),
          (c.excludedAudiences || []).length ? null : ['off', 'none']) +
      '<div class="setrow" style="display:block"><div class="k" ' +
        'style="margin-bottom:6px">Asset optimisation (AI enhancements)</div>' +
        ((c.automation || []).length
          ? c.automation.map(function(a) { return toggleRow(c, a); }).join('')
          : '<div class="rb-sub">No toggles returned by the API — verify ' +
            'in platform.</div>') +
      '</div>' +
      reviewBox(c) +
      '</div>';
  }).join('') + '</div>';

  var actions = settings.conversionActions || [];
  if (actions.length) {
    out += '<div class="subhead">Conversion action setup</div>' +
      '<div class="scroll"><table><thead><tr><th>Action</th><th>Category</th>' +
      '<th>In bidding column</th><th>Primary</th><th>View-through window</th>' +
      '<th>Click window</th><th>Counting</th></tr></thead><tbody>' +
      actions.map(function(a) {
        return '<tr><td class="name"><strong>' + esc(a.name) + '</strong></td>' +
          '<td class="name">' + esc(a.category) + '</td>' +
          '<td class="num">' + (a.inColumn ? 'yes' : 'excluded') + '</td>' +
          '<td class="num">' + (a.primary ? 'primary' : 'secondary') + '</td>' +
          '<td class="num">' + (a.viewThroughDays
              ? a.viewThroughDays + ' days'
              : '<span style="color:var(--down)">none</span>') + '</td>' +
          '<td class="num">' + (a.clickThroughDays ? a.clickThroughDays + ' days' : '—') +
          '</td><td class="num">' + esc(a.counting || '—') + '</td></tr>';
      }).join('') + '</tbody></table></div>';
  }

  out += adGroupSection();
  return out;
}

/** Wire the override selects/inputs after the settings panel renders. */
function bindSettings() {
  var els = document.querySelectorAll(
      '#panel-settings select.ovr, #panel-settings input.ovrtext');
  for (var i = 0; i < els.length; i++) {
    (function(el) {
      var key = el.getAttribute('data-key');
      var stateId = el.getAttribute('data-state');
      el.addEventListener('change', function() {
        ovrSet(key, el.value, stateId);
        // Selects re-render so the effective badge updates; text inputs don't,
        // to preserve what was just typed.
        if (el.tagName === 'SELECT') render();
      });
    })(els[i]);
  }
  // The ground-truth paste is long text: debounce-save while typing/pasting.
  var gt = document.querySelector('#panel-settings textarea.gt-paste');
  if (gt) {
    var timer = null;
    gt.addEventListener('input', function() {
      if (timer) clearTimeout(timer);
      timer = setTimeout(function() {
        ovrSet('settingsGroundTruth', gt.value, 'st-gt');
      }, 700);
    });
  }
}

/** One ad-group settings card. */
function adGroupCard(ag) {
  function list(arr, empty) { return esc((arr || []).join(', ') || empty); }
  function r(k, v, muted) {
    return '<div class="setrow"><span class="k">' + esc(k) + '</span>' +
        '<span class="v"' + (muted ? ' style="color:var(--muted)"' : '') +
        '>' + v + '</span></div>';
  }
  return '<div class="setcard"><h3>' + esc(ag.adGroup) + '</h3>' +
    '<div class="sub">' + esc(ag.status || '') +
      (ag.type ? ' · ' + esc(ag.type) : '') +
      (ag.spend ? ' · ' + money(ag.spend) + ' spend' : '') + '</div>' +
    r('Locations', list(ag.locations, 'All locations'),
        !(ag.locations || []).length) +
    r('Excluded locations', list(ag.excludedLocations, 'None'),
        !(ag.excludedLocations || []).length) +
    r('Languages', list(ag.languages, 'All'), !(ag.languages || []).length) +
    r('Audience lists', list(ag.audiences, 'None at ad-group level'),
        !(ag.audiences || []).length) +
    r('Excluded audiences', list(ag.excludedAudiences, 'None'),
        !(ag.excludedAudiences || []).length) +
    '</div>';
}

/**
 * Ad-group settings, segmented under the Settings tab and grouped by campaign so
 * it is clear which ad groups belong where. Demand Gen often sets location,
 * language and list targeting at the ad group rather than the campaign.
 */
function adGroupSection() {
  var rows = DATA.adGroupSettings || [];
  if (!rows.length) return '';
  var byCampaign = {}, order = [];
  rows.forEach(function(ag) {
    var c = ag.campaign || '—';
    if (!byCampaign[c]) { byCampaign[c] = []; order.push(c); }
    byCampaign[c].push(ag);
  });
  var html = '<div class="settings-section"><div class="subhead">Ad group ' +
    'settings</div><div class="rb-sub" style="margin:0 0 12px">Demand Gen often ' +
    'targets at the ad-group level — location, language and list targeting live ' +
    'here, which is why a campaign can read “Set at ad group”. Audience ' +
    '<em>signals</em> also appear in the Audiences tab.</div>';
  order.forEach(function(c) {
    html += '<div class="ag-camp">' + esc(c) + '</div>' +
        '<div class="setgrid">' +
        byCampaign[c].map(adGroupCard).join('') + '</div>';
  });
  return html + '</div>';
}

function avState(el, msg, color) {
  if (!el) return;
  el.textContent = msg; el.style.color = color;

}

function drawAudienceValidation() {

    'spends against where the account earns, by age and gender. Pulled with the ' +

function drawCompareTables(cmp) {
  var head = '<div class="meta" style="margin:2px 0 12px">Whole account (all ' +
    'non Demand Gen) revenue vs Demand Gen spend · ' + esc(cmp.window.start) +
    ' to ' + esc(cmp.window.end) + '</div>';

  if (noAge && noGender) {
    var c = cmp.counts || {};
    head += '<div class="empty" style="text-align:left;line-height:1.55">' +
      'No age or gender rows came back for this account' +
      (c.brandCampaigns != null
        ? ' (' + c.brandCampaigns + ' non-DG and ' + (c.dgCampaigns || 0) +
          ' Demand Gen campaigns checked)' : '') + '. Some accounts do not ' +
      'report demographics at all.</div>';
  }
  return head + compareTable('Age', cmp.age) + compareTable('Gender', cmp.gender);
}

function compareTable(header, rows) {
  if (!rows || !rows.length) {
    return '<div class="subhead">' + esc(header) + '</div>' +
      '<div class="empty">No data for this split.</div>';
  }
  var body = rows.map(function(r) {
    var idx = r.index;
    var idxTxt = (idx == null) ? '—' : idx.toFixed(2) + '×';
    var idxStyle = (idx == null) ? '' :
      idx >= 1.15 ? 'color:var(--down);font-weight:700' :
      idx <= 0.85 ? 'color:var(--accent);font-weight:700' : '';
    return '<tr><td class="name"><strong>' + esc(r.band) + '</strong></td>' +
      '<td class="num">' + money(r.brandRevenue) +
        '<span class="meta">' + pct0(r.brandRevShare) + ' of rev</span></td>' +
      '<td class="num">' + (r.brandCost ? r.brandRoas.toFixed(2) : '—') +
        '</td>' +
      '<td class="num">' + money(r.dgSpend) +
        '<span class="meta">' + pct0(r.dgSpendShare) + ' of spend</span></td>' +
      '<td class="num" style="' + idxStyle + '">' + idxTxt + '</td></tr>';
  }).join('');
  return '<div class="subhead">' + esc(header) + '</div>' +
    '<div class="scroll"><table><thead><tr><th>' + esc(header) + '</th>' +
    '<th>Brand revenue</th><th>Brand ROAS</th><th>DG spend</th><th>Index</th>' +
    '</tr></thead><tbody>' + body + '</tbody></table></div>';
}

function stratTile(label, value, sub) {
  return '<div class="kpi"><div class="label">' + esc(label) + '</div>' +
    '<div class="value">' + value + '</div>' +
    (sub ? '<div class="delta flat">' + esc(sub) + '</div>' : '') + '</div>';
}

// Headline tiles so the pull reads as a showcase, not a wall of tables.
function stratStatTiles(s) {
  var tiles = [];
  var mix = s.channelMix || [];
  if (mix.length) {
    var spend = 0, conv = 0;
    mix.forEach(function(r) { spend += (r.cost || 0); conv += (r.conversions || 0); });
    tiles.push(stratTile('Spend mined', money(spend),
        mix.length + ' non-DG channel' + (mix.length === 1 ? '' : 's')));
    tiles.push(stratTile('Conversions', int(conv), 'across those channels'));
  }
  var lists = s.audienceLists || [];
  if (lists.length) {
    var excl = lists.filter(function(r) {
      return /purchaser|customer/i.test(r.role); }).length;
    tiles.push(stratTile('Audience lists', String(lists.length),
        excl + ' to exclude · ' + (lists.length - excl) + ' seed'));
  }
  if ((s.audiences || []).length) {
    tiles.push(stratTile('Converting audiences', String(s.audiences.length),
        'already in use'));
  }
  var inv = s.assetInventory || {};
  if (inv.videoCount !== undefined) {
    tiles.push(stratTile('Video assets', String(inv.videoCount || 0),
        (inv.imageCount || 0) + ' image asset' +
        ((inv.imageCount || 0) === 1 ? '' : 's')));
  }
  if ((s.searchThemes || []).length) {
    tiles.push(stratTile('Search themes', String(s.searchThemes.length),
        'converting terms to seed'));
  }
  if ((s.landingPages || []).length) {
    tiles.push(stratTile('Live destinations', String(s.landingPages.length),
        'converting today'));
  }
  if ((s.conversionActions || []).length) {
    var prim = s.conversionActions.filter(function(r) { return r.primary; }).length;
    tiles.push(stratTile('Conversion actions', String(s.conversionActions.length),
        prim + ' primary'));
  }
  if (!tiles.length) return '';
  return '<div class="section-label" style="margin-top:0">Launch signal summary' +
    '</div><div class="kpis" style="margin-bottom:26px">' + tiles.join('') + '</div>';
}

// A thin share bar reused across strategy cards.
function stratBar(frac) {
  var w = Math.max(0, Math.min(1, frac || 0)) * 100;
  return '<div style="height:5px;background:var(--wash);border-radius:4px;' +
    'overflow:hidden;margin-top:4px"><div style="height:100%;width:' +
    w.toFixed(1) + '%;background:var(--accent);border-radius:4px"></div></div>';
}

      }).join('') + '</tbody></table></div>';
  }
  if ((s.devices || []).length) {
    out += '<div class="subhead">Device split (non Demand Gen)</div>' +
      '<div class="scroll"><table><thead><tr><th>Device</th><th>Spend</th>' +

function bindStrategy() {
  var buildBtn = document.getElementById('stratBuild');
  if (buildBtn) buildBtn.onclick = buildStrategyReco;
  var diagBtn = document.getElementById('stratDiag');
  if (diagBtn) diagBtn.onclick = runAccessDiagnostic;
  // Auto-load a previously built plan the first time the view opens.
  if (!STRATEGY_LOADED && !STRATEGY_DATA) {
    STRATEGY_LOADED = true;
    if (window.google && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(res) {
          if (res && res.ok && res.data) { STRATEGY_DATA = res.data; render(); }
        })
        .withFailureHandler(function() {})
        .getStrategyData(CURRENT_ACCOUNT);
    }

// is debuggable without opening the Apps Script editor. It reports the Google
// identity the web app runs as (the DEPLOYING account, not the viewer) and
// which customers that identity can actually reach.
function runAccessDiagnostic() {
  var out = document.getElementById('stratDiagOut');
  var btn = document.getElementById('stratDiag');
  if (!(window.google && google.script && google.script.run)) {
    if (out) { out.style.display = 'block';
      out.textContent = 'Diagnostics need the deployed web app.'; }
    return;
  }
  if (btn) { btn.disabled = true; btn.textContent = 'Diagnosing…'; }
  if (out) { out.style.display = 'block'; out.textContent = 'Running…'; }
  google.script.run
    .withSuccessHandler(function(text) {
      if (out) out.textContent = text || '(no output)';
      if (btn) { btn.disabled = false; btn.textContent = 'Diagnose access'; }
    })
    .withFailureHandler(function(e) {
      if (out) out.textContent = 'Diagnostic failed: ' +

/** Conversion actions: rolled up first, then the campaign-level detail. */
function drawConversions(term) {
  var all = (DATA.conversionActions || []).filter(function(r) {
    return !term ||
        (r.action + ' ' + r.category + ' ' + r.campaign).toLowerCase()
            .indexOf(term) !== -1;
  });

  document.getElementById('count').textContent = all.length + ' rows';

  if (!(DATA.conversionActions || []).length) {
    return '<div class="scroll"><div class="empty">No conversion action ' +
        'breakdown returned. Segmenting by conversion action is unsupported ' +
        'for some accounts — check the run log at the foot of this page.' +
        '</div></div>';
  }
  if (!all.length) {
    return '<div class="scroll"><div class="empty">Nothing matches that ' +
        'filter.</div></div>';
  }

  var byAction = {};
  all.forEach(function(r) {
    var a = byAction[r.action];
    if (!a) {
      a = byAction[r.action] = { action: r.action, category: r.category,
          allConversions: 0, allConvValue: 0, conversions: 0, convValue: 0,
          campaigns: {} };
    }
    a.allConversions += r.allConversions;
    a.allConvValue += r.allConvValue;
    a.conversions += r.conversions;
    a.convValue += r.convValue;
    a.campaigns[r.campaign] = true;
  });

  var rolled = Object.keys(byAction).map(function(k) { return byAction[k]; })
      .sort(function(a, b) { return b.allConversions - a.allConversions; });
  var total = rolled.reduce(function(sum, r) { return sum + r.allConversions; }, 0);
  var max = rolled.length ? rolled[0].allConversions : 0;

  var summary = '<div class="subhead">Every action, all campaigns</div>' +
    '<div class="scroll"><table><thead><tr>' +
      '<th>Conversion action</th><th>Share</th><th>All conv.</th>' +
      '<th>Value</th><th>In bidding column</th><th>Campaigns</th>' +
    '</tr></thead><tbody>' +
    rolled.map(function(r) {
      var inBidding = r.conversions > 0;
      return '<tr><td class="name"><strong>' + esc(r.action) + '</strong>' +
        (r.category ? '<span class="meta">' + esc(r.category) + '</span>' : '') +
        '</td>' +
        '<td><span class="sharebar" style="width:' +
          Math.max(2, (max ? r.allConversions / max : 0) * 90) + 'px"></span>' +
          '<span class="meta">' + pct0(total ? r.allConversions / total : 0) +
          ' of all</span></td>' +
        '<td class="num">' + dec(r.allConversions) + '</td>' +
        '<td class="num">' + (r.allConvValue ? money(r.allConvValue) : '—') + '</td>' +
        '<td class="num">' + (inBidding ? dec(r.conversions) : 'excluded') + '</td>' +
        '<td class="num">' + Object.keys(r.campaigns).length + '</td></tr>';
    }).join('') + '</tbody></table></div>';

  var detail = '<div class="subhead">Broken out by campaign</div>' +
    '<div class="scroll"><table><thead><tr>' +
      '<th>Conversion action</th><th>Campaign</th><th>All conv.</th>' +
      '<th>Value</th><th>In bidding column</th>' +
    '</tr></thead><tbody>' +
    all.slice().sort(function(a, b) { return b.allConversions - a.allConversions; })
      .map(function(r) {
        return '<tr><td class="name"><strong>' + esc(r.action) + '</strong>' +
          (r.category ? '<span class="meta">' + esc(r.category) + '</span>' : '') +
          '</td><td class="name">' + esc(r.campaign) + '</td>' +
          '<td class="num">' + dec(r.allConversions) + '</td>' +
          '<td class="num">' + (r.allConvValue ? money(r.allConvValue) : '—') + '</td>' +
          '<td class="num">' + (r.conversions > 0 ? dec(r.conversions) : 'excluded') +
          '</td></tr>';
      }).join('') + '</tbody></table></div>';

  return summary + detail;
}

/** Metrics the surface donuts can switch between. */
function surfaceMetrics() {

function activeMetric() {

  SURFACE_METRIC = 'cost';
  return options[0];
}

/** Donut plus legend. Composition reads faster as an arc than as a bar list. */
function donut(title, rows, labelKey, metric) {
  var slices = rows.filter(function(r) { return (r[metric.key] || 0) > 0; })
      .sort(function(a, b) { return b[metric.key] - a[metric.key]; });
  var total = slices.reduce(function(sum, r) { return sum + r[metric.key]; }, 0);

  if (!total) {
    return '<div class="donutcard"><h3>' + esc(title) + '</h3>' +
        '<div class="empty">No ' + esc(metric.label.toLowerCase()) +
        ' recorded.</div></div>';
  }

  var radius = 54;
  var circumference = 2 * Math.PI * radius;
  var offset = 0;
  var arcs = slices.map(function(r) {
    var length = (r[metric.key] / total) * circumference;
    var arc = '<circle cx="70" cy="70" r="' + radius + '" fill="none" ' +
        'stroke="' + (r.color || '#8A8F9E') + '" stroke-width="23" ' +
        'stroke-dasharray="' + length.toFixed(2) + ' ' +
        (circumference - length).toFixed(2) + '" ' +
        'stroke-dashoffset="' + (-offset).toFixed(2) + '" ' +
        'transform="rotate(-90 70 70)"><title>' + esc(r[labelKey]) + ': ' +
        esc(metric.fmt(r[metric.key])) + '</title></circle>';
    offset += length;
    return arc;
  }).join('');

  var legend = slices.map(function(r) {
    return '<div class="row"><span class="dot" style="background:' +
        (r.color || '#8A8F9E') + '"></span>' +
        '<span class="nm">' + esc(r[labelKey]) + '</span>' +
        '<span class="vl">' + metric.fmt(r[metric.key]) + '</span>' +
        '<span class="sh">' + pct0(r[metric.key] / total) + '</span></div>';
  }).join('');

  return '<div class="donutcard"><h3>' + esc(title) + '</h3>' +
    '<div class="donutrow">' +
      '<svg width="140" height="140" viewBox="0 0 140 140" role="img" ' +
      'aria-label="' + esc(title) + ' by ' + esc(metric.label) + '">' + arcs +
      '<g class="donut-total"><text x="70" y="66" class="big">' +
      esc(metric.fmt(total)) + '</text>' +
      '<text x="70" y="84" class="small">' + esc(metric.label) + '</text></g>' +
      '</svg>' +
      '<div class="donutlegend">' + legend + '</div>' +
    '</div></div>';
}

  { label: 'Audience', views: ['audiences', 'demographics', 'audienceValidation'], mode: 'analyze' },
  { label: 'Structure', views: ['campaigns', 'adGroups', 'settings'], mode: 'analyze' },
  { label: 'Outcomes', views: ['conversions', 'daily'], mode: 'analyze' },
  { label: 'Launch', views: ['strategy'], mode: 'strategy' },
  { label: 'AI', views: ['aiAnalysis'], mode: 'analyze' }
];

function modeGroups() {
  return GROUPS.filter(function(g) { return (g.mode || 'analyze') === APP_MODE; });
}

/** Index of the active view's group within the current mode's groups. */
function groupOf(viewId) {
  var mg = modeGroups();
  for (var i = 0; i < mg.length; i++) {
    if (mg[i].views.indexOf(viewId) !== -1) return i;
  }
  return 0;
}

function buildModeBar() {
  var bar = document.getElementById('appModes');
  if (!bar) return;
  bar.innerHTML = '';
  APP_MODES.forEach(function(m) {
    var btn = document.createElement('button');
    btn.textContent = m.label;
    btn.setAttribute('aria-selected', String(m.key === APP_MODE));
    btn.onclick = function() { setAppMode(m.key); };
    bar.appendChild(btn);
  });
  var intro = document.getElementById('modeIntro');
  var cur = APP_MODES.filter(function(m) { return m.key === APP_MODE; })[0];
  if (intro && cur) intro.textContent = cur.intro;
}

function setAppMode(mode) {
  if (mode === APP_MODE) return;
  APP_MODE = mode;
  var root = document.getElementById('root');
  if (root) root.setAttribute('data-mode', mode);

  // The build wizard produces the strategy deck when strategy mode is on and
  // the audit deck otherwise, so the tab drives that server-side toggle.
  if (mode === 'audit' || mode === 'strategy') {
    var on = mode === 'strategy';
    STRATEGY_MODE = on;
    if (on) OVERRIDES['strategyMode::' + CURRENT_ACCOUNT] = 'true';
    else delete OVERRIDES['strategyMode::' + CURRENT_ACCOUNT];
    if (window.google && google.script && google.script.run) {
      google.script.run.setStrategyMode(CURRENT_ACCOUNT, on);
    }
    syncWizardCopy();
  }

  // Land on the first available view of the new mode.
  var first = null;
  modeGroups().some(function(g) {
    var av = g.views.filter(function(id) { return VIEWS[id]; });
    if (av.length) { first = av[0]; return true; }
    return false;
  });
  if (first) ACTIVE = first;

  buildModeBar();
  buildNav();
  buildToolbar();
  render();
}

/**
 * Collapsible wizard so the four steps stop taking a static wall of space.
 * Step 1 opens; 2 to 4 fold to a header until clicked. Clicking a title toggles
 * its own step; unlocking a step (step 1 done) auto-opens the next.
 */
function initWizardAccordion() {
  var steps = document.querySelectorAll('#deckWrap .wstep');
  for (var i = 0; i < steps.length; i++) {
    if (i > 0) steps[i].classList.add('collapsed');
    var title = steps[i].querySelector('.wtitle');
    if (title) title.onclick = (function(step) {
      return function() { step.classList.toggle('collapsed'); };
    })(steps[i]);
  }
}

/** Open one wizard step (1-based) and collapse the rest. */
function expandStep(n) {
  var steps = document.querySelectorAll('#deckWrap .wstep');
  for (var i = 0; i < steps.length; i++) {
    if (i === n - 1) steps[i].classList.remove('collapsed');
    else steps[i].classList.add('collapsed');
  }
}

/** Point the wizard's step 1 at the deck type the current mode builds. */
function syncWizardCopy() {
  var strategy = APP_MODE === 'strategy';
  var t = document.querySelector('#wstep1 .wtitle');
  var s = document.querySelector('#wstep1 .wsub');
  if (t) t.textContent = strategy ? 'Build the launch-plan deck'
                                  : 'Build the rough deck';
  if (s) s.textContent = strategy
    ? 'Generates the on-brand Demand Gen launch-plan deck from the mined account.'
    : 'Generates the on-brand Google Slides audit deck from the pulled data.';
}

// Panels are now created on demand inside the open accordion section, so there
// is nothing to pre-build. Kept as a no-op so existing call sites stay valid.
function buildPanels() {}

function selectView(id) {
  ACTIVE = id;
  // The Ads table leads with the winners: sort by net profit so the creatives
  // that paid for themselves sit at the top. Everything else sorts by spend.
  SORT = (id === 'ads')
      ? { key: 'netProfit', asc: false }
      : { key: 'cost', asc: false };
  buildNav();
  buildToolbar();
  render();
}

function buildNav() {
  var tabs = document.getElementById('tabs');
  var mg = modeGroups();
  var activeGroup = groupOf(ACTIVE);
  tabs.innerHTML = '';

  mg.forEach(function(group, index) {
    var available = group.views.filter(function(id) { return VIEWS[id]; });
    if (!available.length) return;

    var btn = document.createElement('button');
    btn.textContent = group.label;
    btn.setAttribute('aria-selected', String(index === activeGroup));
    btn.onclick = function() {
      // Jump to a group: open its first section, collapse the rest.
      selectView(available[0]);
    };
    tabs.appendChild(btn);
  });

  // A single group in the mode needs no top row.
  if (mg.length < 2) tabs.style.display = 'none';
  else tabs.style.display = '';

  buildAccordion();
}

// Each view in the active group is a collapsible section. Exactly one is open
// at a time (the ACTIVE view); its body carries that view's toolbar and panel,
// so every section keeps its own filters and sort unambiguous.
function buildAccordion() {
  var acc = document.getElementById('accordion');
  if (!acc) return;
  var mg = modeGroups();
  var activeGroup = groupOf(ACTIVE);
  var group = mg[activeGroup] || mg[0] || { views: [] };
  var views = group.views.filter(function(id) { return VIEWS[id]; });
  acc.innerHTML = '';

  views.forEach(function(id) {
    var view = VIEWS[id];
    var open = (id === ACTIVE);
    var section = document.createElement('section');
    section.className = 'acc' + (open ? '' : ' collapsed');

    var head = document.createElement('button');
    head.className = 'acc-head';
    head.innerHTML = '<span class="acc-title">' + esc(view.label) + '</span>' +
        '<span class="tally">' + view.rows().length + '</span>' +
        '<span class="acc-chev" aria-hidden="true"></span>';
    head.setAttribute('aria-expanded', String(open));
    head.onclick = function() {
      if (id === ACTIVE) {
        // Collapse the open section — nothing is active.
        ACTIVE = null;
        buildAccordion();
      } else {
        selectView(id);
      }
    };
    section.appendChild(head);

    var body = document.createElement('div');
    body.className = 'acc-body';
    if (open) {
      var tb = document.createElement('div');
      tb.className = 'toolbar';
      tb.id = 'toolbar';
      body.appendChild(tb);
      var panel = document.createElement('div');
      panel.className = 'panel active';
      panel.id = 'panel-' + id;
      body.appendChild(panel);
    }
    section.appendChild(body);
    acc.appendChild(section);
  });
}

function buildToolbar() {
  var bar = document.getElementById('toolbar');
  // No open section (every accordion row collapsed) — nothing to fill.
  if (!bar || !ACTIVE) return;
  var isVideo = ACTIVE === 'videos';

  // The storyboard is a review surface, not a data table — no filters or sort.
  if (ACTIVE === 'story') { bar.innerHTML = ''; return; }

  // These views are showcases, not filterable tables: a count, no search box.
  if (ACTIVE === 'settings' || ACTIVE === 'landingPages' ||
      ACTIVE === 'strategy' || ACTIVE === 'aiAnalysis' ||
      ACTIVE === 'audienceValidation' || ACTIVE === 'clientUpdate') {
    bar.innerHTML = '<span class="count" id="count"></span>';
    return;
  }

  if (ACTIVE === 'surfaces') {
    bar.innerHTML = '<select id="surfaceMetric" aria-label="Metric shown">' +
      surfaceMetrics().map(function(metric) {
        return '<option value="' + esc(metric.key) + '"' +
            (metric.key === SURFACE_METRIC ? ' selected' : '') + '>Show ' +
            esc(metric.label.toLowerCase()) + '</option>';
      }).join('') + '</select><span class="count" id="count"></span>';
    document.getElementById('surfaceMetric').onchange = function() {
      SURFACE_METRIC = this.value;
      render();
    };
    return;
  }

  // Ads and Videos carry real purchase economics, so both get a one-click
  // "Profitable only" toggle that keeps just the creatives whose purchase
  // revenue beat their spend.
  var showProfit = (ACTIVE === 'ads' || isVideo);
  var profitChip = showProfit
      ? '<button class="filter profit-toggle" id="profitOnly" aria-pressed="' +
        PROFIT_ONLY + '">✓ Profitable only</button>'
      : '';

  bar.innerHTML =
    '<input id="search" type="search" placeholder="Filter by name">' +
    profitChip +
    (isVideo
      ? '<div class="chips" id="videoChips"></div>' +
        '<select id="videoSort">' +
          '<option value="netProfit">Sort by net profit</option>' +
          '<option value="purchaseRoas">Sort by purchase ROAS</option>' +
          '<option value="orders">Sort by purchases</option>' +
          '<option value="cost">Sort by spend</option>' +
          '<option value="conv">Sort by conversions</option>' +
          '<option value="cpa">Sort by cost per action</option>' +
          '<option value="viewRate">Sort by view rate</option>' +
          '<option value="p100">Sort by full watches</option>' +
          '<option value="impressions">Sort by impressions</option>' +
        '</select>'
      : '') +
    '<span class="count" id="count"></span>';

  document.getElementById('search').addEventListener('input', render);

  if (showProfit) {
    document.getElementById('profitOnly').onclick = function() {
      PROFIT_ONLY = !PROFIT_ONLY;
      this.setAttribute('aria-pressed', String(PROFIT_ONLY));
      render();
    };
  }

  if (isVideo) {
    document.getElementById('videoChips').innerHTML =
        VIDEO_FILTERS.map(function(f) {
          return '<button class="filter" data-filter="' + f[0] +
              '" aria-pressed="' + (VIDEO_FILTER === f[0]) + '">' + f[1] +
              '</button>';
        }).join('');
    var chips = document.querySelectorAll('#videoChips .filter');
    for (var i = 0; i < chips.length; i++) {
      chips[i].onclick = function() {
        VIDEO_FILTER = this.getAttribute('data-filter');
        buildToolbar();
        render();
      };
    }
    var sel = document.getElementById('videoSort');
    sel.value = VIDEO_SORT;
    sel.onchange = function() { VIDEO_SORT = this.value; render(); };
  }
}

// --- storyboard -----------------------------------------------------------
// A preview of the client deck BEFORE any .pptx exists: one card per planned
// slide, each annotatable. Notes save to the Commentary sheet and flow into
// both the exported deck and the deck-design prompt.
function scorecardHtml(videos) {
  videos = (videos || []).slice(0, 24);
  if (!videos.length) {
    return '<p class="meta">No creatives with delivery in this window.</p>';
  }
  function watch(v) {
    if (!(v.p25 || v.p50 || v.p75 || v.p100)) return 'watch —';
    return 'watch ' + pct0(v.p25) + ' / ' + pct0(v.p50) + ' / ' +
        pct0(v.p75) + ' / ' + pct0(v.p100);
  }
  var tiles = videos.map(function(v) {
    var ai = (v.source || '') !== 'Advertiser';
    var shot = v.thumb
        ? '<img src="' + esc(v.thumb) + '" alt="" loading="lazy">'
        : '';
    var badge = ai ? '<span class="badge">AI cut</span>' : '';
    var link = v.url
        ? '<a href="' + esc(v.url) + '" target="_blank" rel="noopener">' +
          esc(v.title) + '</a>'
        : esc(v.title);
    return '<div class="cretile">' +
      '<div class="shot">' + shot + badge + '</div>' +
      '<h5>' + link + '</h5>' +
      '<div class="src ' + (ai ? 'ai' : '') + '">' +
        (ai ? 'Enhanced by Google AI' : 'Advertiser') + ' · VR ' +
        pct(v.viewRate) + '</div>' +
      '<div class="m">' + watch(v) + '</div>' +
      '<div class="m">' + dec(v.conversions) + ' conv · ' + int(v.viewThrough) +
        ' vt · ' + money(v.cost) + ' · ' + int(v.impressions) + ' impr</div>' +
    '</div>';
  }).join('');
  return '<div class="cregrid">' + tiles +
    '<div class="cregrid-foot">Every creative on one page — this is the slide, ' +
    'not one slide per video. VR = view rate · watch = share reaching ' +
    '25/50/75/100% · vt = view-through conversions.</div></div>';
}

function drawStoryboard() {
  var slides = DATA.storyboard || [];
  var intro = '<div class="story-intro">' +
    '<h3>Deck storyboard</h3>' +
    '<p>Each card below is a slide in the client deck — reviewable before the ' +
    'deck is built. Add an emphasis note to any slide to give Claude a focal ' +
    'point; notes save automatically and flow into both the exported deck and ' +
    'the deck-design prompt. The argument this deck makes: <b>' +
    esc(POV_TAGLINE) + '.</b></p>' +
    '<div class="story-actions">' +
      '<button class="briefbtn" id="storyPromptBtn">Copy deck design prompt' +
        '</button>' +
      '<button class="briefbtn" id="storyDeckBtn">Build slide deck</button>' +
    '</div>' +
    '<p style="margin:12px 0 0;color:var(--faint);font-size:13px">When you ' +
    'build: paste the prompt to Claude with the exported deck, and attach your ' +
    'settings and ad-group audience screenshots plus the full data sheet ' +
    '(File → Download → .xlsx) as the authoritative source.</p>' +

  if (!slides.length) {

  }).join('');
