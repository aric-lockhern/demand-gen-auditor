<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Demand Gen Audit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700&family=Fraunces:opsz,wght@9..144,500;9..144,600&display=swap" rel="stylesheet">
<style>
  :root {
    /* Lockhern Digital brand palette. */
    --ink: #0E0E0E;        /* brand black */
    --ink-soft: #2A2F3A;
    --muted: #6B7A99;      /* brand dark gray */
    --faint: #BAC3D6;      /* brand mid gray */
    --paper: #F4F6FA;
    --card: #FFFFFF;
    --rule: #E7ECF4;       /* brand light gray */
    --wash: #F4F6FA;
    --accent: #317AE0;     /* brand primary blue */
    --accent-2: #2E51C0;   /* brand secondary blue */
    --deep: #0E2970;       /* brand tertiary navy */
    --up: #1B7F5A;
    --down: #C24B3C;
    --star: #E0A030;
    /* Figures use the body face with tabular spacing rather than a monospace,
       which keeps columns aligned without the terminal-readout look. */
    --sans: "Figtree", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
            Helvetica, sans-serif;
    --display: "Fraunces", Georgia, "Times New Roman", serif;
    --figures: var(--sans);
    --lift: 0 1px 2px rgba(25,28,36,.05), 0 4px 12px rgba(25,28,36,.04);
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--paper); color: var(--ink);
    font-family: var(--sans); font-size: 15.5px; line-height: 1.65;
    -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
  }
  .wrap { max-width: 1300px; margin: 0 auto; padding: 40px 28px 120px; }
  .num, .kpi .value, .stat .v, .funnel .pctv {
    font-family: var(--figures); font-variant-numeric: tabular-nums;
    font-feature-settings: "tnum" 1;
  }

  header { margin-bottom: 28px; }
  .kicker {
    font-size: 12.5px; font-weight: 500; color: var(--muted);
    letter-spacing: .01em; margin-bottom: 5px;
  }
  h1 {
    font-family: var(--display); font-size: clamp(30px, 4vw, 41px);
    font-weight: 600; letter-spacing: -.012em; margin: 0 0 6px;
    line-height: 1.18; font-optical-sizing: auto;
  }
  .titlerow { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
  .titlerow h1 { margin-bottom: 0; }
  #accountPicker {
    padding: 8px 12px; border: 1px solid var(--rule); border-radius: 9px;
    background: var(--card); font-family: var(--sans); font-size: 14px;
    font-weight: 600; color: var(--ink); box-shadow: var(--lift);
  }
  #accountPicker:focus { outline: 2px solid var(--ink); outline-offset: -1px; }
  .window { color: var(--muted); font-size: 14px; }
  .window b { color: var(--ink-soft); font-weight: 600; }
  .window a { color: var(--ink); }

  .card {
    background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: var(--lift);
  }
  .section-label {
    font-size: 13px; font-weight: 500; color: var(--muted); margin-bottom: 10px;
  }

  .readout { padding: 22px 24px; margin-bottom: 28px; }
  .readout ul { margin: 0; padding: 0; list-style: none; }
  .readout li {
    padding: 11px 0 11px 26px; position: relative; color: var(--ink-soft);
    border-top: 1px solid var(--rule); font-size: 15.5px; line-height: 1.6;
  }
  .readout li:first-child { border-top: none; padding-top: 2px; }
  .readout li::before {
    content: ""; position: absolute; left: 6px; top: 19px;
    width: 6px; height: 6px; border-radius: 50%; background: var(--faint);
  }
  .readout li:first-child::before { top: 12px; }
  .readout b { color: var(--ink); font-weight: 600; }

  .spectrum { margin-bottom: 28px; }
  .spectrum-bar {
    display: flex; height: 56px; border-radius: 12px; overflow: hidden;
    box-shadow: var(--lift); background: var(--card);
  }
  .seg {
    border: none; padding: 0; cursor: pointer; min-width: 3px;
    transition: width .7s cubic-bezier(.22,1,.36,1), opacity .15s;
  }
  .seg:hover { opacity: .85; }
  .seg:focus-visible { outline: 3px solid var(--ink); outline-offset: -3px; }
  .seg[aria-pressed="true"] { box-shadow: inset 0 0 0 3px var(--ink); }
  .legend {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
    gap: 10px; margin-top: 12px;
  }
  .legend-item {
    padding: 12px 14px; border-radius: 10px; background: var(--card);
    border: 1px solid var(--rule);
  }
  .legend-item .top { display: flex; align-items: center; gap: 8px; }
  .dot { width: 9px; height: 9px; border-radius: 50%; flex: none; }
  .legend-item .name { font-weight: 600; font-size: 14.5px; }
  .legend-item .figs { font-size: 13px; color: var(--muted); margin-top: 3px; }

  .modebar {
    display: flex; align-items: center; gap: 14px; flex-wrap: wrap;
    margin-bottom: 18px;
  }
  .switch {
    display: inline-flex; background: var(--card); border: 1px solid var(--rule);
    border-radius: 10px; padding: 3px; box-shadow: var(--lift);
  }
  .switch button {
    border: none; background: none; padding: 8px 16px; border-radius: 8px;
    font-family: var(--sans); font-size: 14px; font-weight: 500;
    color: var(--muted); cursor: pointer;
  }
  .switch button[aria-pressed="true"] { background: var(--ink); color: #fff; }
  .mode-hint { font-size: 13px; color: var(--muted); }

  .kpis {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(168px, 1fr));
    gap: 10px; margin-bottom: 32px;
  }
  /* Real-impact hero band: the purchase truth, kept apart from the KPI grid. */
  .impact-card {
    background: linear-gradient(135deg, #0E2970, #317AE0); color: #fff;
    border-radius: 16px; padding: 20px 22px; margin-bottom: 20px;
    box-shadow: var(--lift);
  }
  .impact-head { font-family: var(--display); font-size: 18px; font-weight: 650; }
  .impact-sub {
    display: block; font-family: var(--sans); font-size: 12.5px; font-weight: 400;
    opacity: .85; margin-top: 3px;
  }
  .impact-grid {
    display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 14px; margin-top: 16px;
  }
  .impact-tile {
    background: rgba(255, 255, 255, .1); border-radius: 12px; padding: 13px 15px;
  }
  .impact-tile .il { font-size: 12.5px; opacity: .85; }
  .impact-tile .iv {
    font-size: 27px; font-weight: 700; letter-spacing: -.02em; margin-top: 3px;
  }
  .impact-tile .is { font-size: 11.5px; opacity: .8; margin-top: 3px; }

  .funnel-card { margin-bottom: 32px; }
  .funnelviz { margin-top: 12px; }
  .funnelviz .fn-row { display: flex; justify-content: center; margin: 7px 0; }
  .funnelviz .fn-bar {
    background: linear-gradient(135deg, #6D5AE6, #317AE0); color: #fff;
    border-radius: 10px; padding: 12px 18px; display: flex; gap: 14px;
    align-items: baseline; justify-content: space-between; min-width: 220px;
    box-shadow: var(--lift);
  }
  .funnelviz .fn-label { font-weight: 650; font-size: 14px; }
  .funnelviz .fn-val { font-size: 12.5px; opacity: .92; white-space: nowrap; }
  .kpi {
    background: var(--card); border: 1px solid var(--rule); border-radius: 12px;
    padding: 15px 17px; box-shadow: var(--lift);
  }
  .kpi .label { font-size: 13px; color: var(--muted); font-weight: 500; }
  .kpi .value {
    font-size: 26px; font-weight: 600; letter-spacing: -.018em; margin-top: 5px;
  }
  .delta { font-size: 13px; margin-top: 4px; font-weight: 500; }
  .delta.up { color: var(--up); } .delta.down { color: var(--down); }
  .delta.flat { color: var(--faint); }

  nav.tabs { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 18px; }
  nav.tabs button {
    background: var(--card); border: 1px solid var(--rule); border-radius: 10px;
    padding: 9px 15px; cursor: pointer; font-family: var(--sans);
    font-size: 14px; font-weight: 500; color: var(--muted);
  }
  nav.tabs button:hover { color: var(--ink); }
  nav.tabs button[aria-selected="true"] {
    background: var(--ink); border-color: var(--ink); color: #fff;
  }
  nav.tabs .tally { opacity: .6; font-weight: 500; }

  .toolbar {
    display: flex; gap: 10px; align-items: center; margin-bottom: 16px;
    flex-wrap: wrap;
  }
  .toolbar:empty { display: none; }
  .toolbar input, .toolbar select {
    padding: 9px 13px; border: 1px solid var(--rule); border-radius: 9px;
    font-family: var(--sans); font-size: 14px; background: var(--card);
    color: var(--ink);
  }
  .toolbar input { flex: 1; min-width: 200px; max-width: 300px; }
  .toolbar input:focus, .toolbar select:focus {
    outline: 2px solid var(--ink); outline-offset: -1px;
  }
  .count { font-size: 13px; color: var(--muted); margin-left: auto; }

  .chips { display: flex; gap: 7px; flex-wrap: wrap; }
  .filter {
    border: 1px solid var(--rule); background: var(--card); border-radius: 20px;
    padding: 7px 14px; font-size: 13.5px; font-weight: 500; cursor: pointer;
    color: var(--muted); font-family: var(--sans);
  }
  .filter:hover { color: var(--ink); }
  .filter[aria-pressed="true"] {
    background: var(--ink); color: #fff; border-color: var(--ink);
  }
  /* The profit toggle reads as money: green when engaged. */
  .profit-toggle[aria-pressed="true"] {
    background: var(--up); color: #fff; border-color: var(--up);
  }

  /* Winner rows: the creatives whose purchase revenue beat their spend. */
  tbody tr.win td { background: rgba(27,127,90,.07); }
  tbody tr.win:hover td { background: rgba(27,127,90,.13); }
  tbody tr.win td.name { box-shadow: inset 3px 0 0 var(--up); }

  /* Pause workflow: checkbox column + action bar above the Ads table. */
  th.pick, td.pick { width: 34px; text-align: center; padding-left: 4px; }
  th.pick input, td.pick input { width: 15px; height: 15px; cursor: pointer; }
  .pausebar {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; flex-wrap: wrap; margin-bottom: 12px; padding: 11px 14px;
    background: var(--wash); border: 1px solid var(--rule); border-radius: 12px;
  }
  .pausebar .pb-left { font-size: 14px; color: var(--ink); }
  .pausebar .pb-hint { color: var(--muted); font-size: 12.5px; }
  .pausebar .pb-right {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
  }
  .pb-floor { font-size: 12.5px; color: var(--muted); display: flex;
    align-items: center; gap: 5px; }
  .pb-floor input {
    width: 72px; padding: 6px 8px; border: 1px solid var(--rule);
    border-radius: 8px; font-family: var(--sans); font-size: 13px;
  }
  .pb-btn {
    border: 1px solid var(--ink); background: var(--ink); color: #fff;
    border-radius: 20px; padding: 7px 14px; font-size: 13.5px; font-weight: 600;
    cursor: pointer; font-family: var(--sans);
  }
  .pb-btn:hover { opacity: .92; }
  .pb-btn.danger { background: var(--down); border-color: var(--down); }
  .pb-btn.undo {
    background: var(--card); color: var(--ink); border-color: var(--ink);
  }
  .pb-btn.undo:hover { background: var(--wash); opacity: 1; }
  .pb-btn:disabled { opacity: .4; cursor: not-allowed; }

  /* Live serving-status pill in the Ads table. */
  .pill {
    display: inline-block; padding: 2px 9px; border-radius: 11px;
    font-size: 11.5px; font-weight: 600; white-space: nowrap;
  }
  .pill.on { background: rgba(27,127,90,.14); color: var(--up); }
  .pill.off { background: var(--wash); color: var(--muted);
    border: 1px solid var(--rule); }
  .pill.gone { background: rgba(194,75,60,.12); color: var(--down); }

  /* ---- Client update one-pager ---- */
  .cu-actions { display: flex; align-items: center; gap: 12px; margin-bottom: 14px;
    flex-wrap: wrap; }
  .cu-warn { font-size: 12.5px; color: var(--down); }
  .cu-note { font-size: 12px; color: var(--muted); }
  .cu-window { display: inline-flex; align-items: center; gap: 8px;
    font-size: 12.5px; color: var(--muted); }
  .cu-window select {
    padding: 7px 10px; border: 1px solid var(--rule); border-radius: 8px;
    font-family: var(--sans); font-size: 13px; background: var(--card);
    color: var(--ink);
  }
  .pb-btn.ghost { background: var(--card); color: var(--ink);
    border-color: var(--rule); font-weight: 600; }
  .pb-btn.ghost:hover { background: var(--wash); opacity: 1; }
  .cu-check { display: inline-flex; align-items: center; gap: 5px;
    font-size: 12.5px; color: var(--muted); cursor: pointer; }
  .cu-check input { width: 14px; height: 14px; }

  /* Account discovery */
  .disc-btn {
    margin-left: 10px; border: 1px solid var(--rule); background: var(--card);
    color: var(--ink); border-radius: 8px; padding: 6px 12px; font-size: 13px;
    font-weight: 600; cursor: pointer; font-family: var(--sans);
  }
  .disc-btn:hover { background: var(--wash); }
  .acct-panel {
    margin: 10px 0 4px; border: 1px solid var(--rule); border-radius: 10px;
    background: var(--card); box-shadow: var(--lift); max-width: 340px;
    max-height: 300px; overflow-y: auto;
  }
  .disc-head { display: flex; align-items: center; justify-content: space-between;
    padding: 7px 12px; font-size: 10.5px; font-weight: 700; color: var(--muted);
    text-transform: uppercase; letter-spacing: .03em;
    border-bottom: 1px solid var(--rule); position: sticky; top: 0;
    background: var(--card); }
  .disc-mini { border: none; background: none; color: var(--accent);
    font-size: 11px; font-weight: 600; cursor: pointer; text-transform: none;
    letter-spacing: 0; }
  .disc-row { display: flex; align-items: center; justify-content: space-between;
    gap: 10px; padding: 7px 12px; border-bottom: 1px solid var(--rule); }
  .disc-row:last-child { border-bottom: none; }
  .disc-nm { font-size: 13px; font-weight: 600; color: var(--ink); min-width: 0; }
  .disc-id { font-size: 10.5px; font-weight: 400; color: var(--muted); margin-top: 1px; }
  .disc-cur { font-size: 10.5px; font-weight: 700; color: var(--up);
    background: rgba(27,127,90,.12); padding: 1px 6px; border-radius: 8px; }
  .disc-open { color: var(--accent); font-weight: 700; font-size: 12px;
    text-decoration: none; white-space: nowrap; }
  .disc-open:hover { text-decoration: underline; }
  .disc-audit { border: 1px solid var(--ink); background: var(--ink); color: #fff;
    border-radius: 14px; padding: 4px 11px; font-size: 11.5px; font-weight: 600;
    cursor: pointer; font-family: var(--sans); white-space: nowrap; }
  .disc-audit:disabled { opacity: .5; cursor: default; }
  .disc-empty { padding: 14px; font-size: 12.5px; color: var(--muted); }

  /* Report share mode: only the clean client update, centered. */
  .cu-report { margin: 0 auto; }
  body.report-only .wrap { max-width: 1000px; padding-top: 20px; }
  body.report-only header,
  body.report-only .analyze-only,
  body.report-only .tabs,
  body.report-only .note,
  body.report-only .acc-head,
  body.report-only .cu-window,
  body.report-only #cuPrint,
  body.report-only .build-tools,
  body.report-only .wizard,
  body.report-only .cu-note,
  body.report-only .cu-warn { display: none !important; }
  body.report-only .acc-wrap { margin-top: 0; }
  body.report-only .acc, body.report-only .acc-body,
  body.report-only .panel { border: none; background: none; box-shadow: none;
    padding: 0; margin: 0; }
  body.report-only .cu-actions { margin: 0 0 4px; }
  body.report-only .cu-report { box-shadow: var(--lift); }
  .cu-report {
    background: var(--card); border: 1px solid var(--rule); border-radius: 16px;
    box-shadow: var(--lift); padding: 30px 32px; max-width: 940px;
  }
  .cu-head {
    display: flex; justify-content: space-between; align-items: flex-start;
    gap: 16px; border-bottom: 2px solid var(--ink); padding-bottom: 16px;
  }
  .cu-title { font-family: var(--serif, var(--sans)); font-size: 25px;
    font-weight: 700; color: var(--ink); letter-spacing: -.01em; }
  .cu-sub { font-size: 13.5px; color: var(--muted); margin-top: 4px; }
  .cu-by { font-size: 11.5px; color: var(--muted); text-align: right;
    line-height: 1.5; }
  .cu-by b { color: var(--ink); font-size: 13px; }

  .cu-band {
    display: grid; grid-template-columns: repeat(5, 1fr); gap: 1px;
    background: var(--rule); border: 1px solid var(--rule); border-radius: 12px;
    overflow: hidden; margin: 20px 0;
  }
  .cu-kpi { background: var(--card); padding: 14px 14px 16px; }
  /* Lighter Lockhern-blue highlight for the headline metrics. */
  .cu-kpi.big { background: linear-gradient(135deg, #317AE0 0%, #2E51C0 100%); }
  .cu-kpi.big .cu-k, .cu-kpi.big .cu-s { color: rgba(255,255,255,.82); }
  .cu-kpi.big .cu-v { color: #fff; }
  .cu-k { font-size: 11.5px; color: var(--muted); text-transform: uppercase;
    letter-spacing: .04em; }
  .cu-v { font-size: 22px; font-weight: 700; color: var(--ink); margin-top: 5px;
    letter-spacing: -.01em; }
  .cu-s { font-size: 11px; color: var(--muted); margin-top: 3px; }
  @media (max-width: 760px) { .cu-band { grid-template-columns: repeat(2, 1fr); } }

  .cu-overview { margin: 20px 0 4px; padding: 16px 18px; border-radius: 12px;
    background: var(--wash); border: 1px solid var(--rule); }
  .cu-overview .cu-h { margin-bottom: 8px; }
  .cu-ov { margin: 0; padding-left: 20px; }
  .cu-ov li { font-size: 14px; line-height: 1.6; color: var(--ink);
    margin-bottom: 5px; }
  .cu-ov li:last-child { margin-bottom: 0; }
  .cu-mini { border: 1px solid var(--rule); background: var(--card);
    color: var(--muted); border-radius: 14px; padding: 3px 10px; font-size: 11.5px;
    font-weight: 600; cursor: pointer; font-family: var(--sans); }
  .cu-mini:hover { color: var(--ink); }
  .cu-mini:disabled { opacity: .5; cursor: default; }

  .cu-pipe {
    display: flex; gap: 16px; align-items: stretch; margin-bottom: 8px;
    border: 1px solid var(--rule); border-left: 4px solid var(--accent, #2F6BE0);
    border-radius: 12px; padding: 16px 18px; background: var(--wash);
  }
  .cu-pipe-n { flex: 1; }
  .cu-pipe-v { font-size: 19px; font-weight: 700; color: var(--ink); margin: 4px 0; }
  .cu-pipe-val { text-align: right; min-width: 150px; }

  .cu-sech { font-size: 12.5px; font-weight: 700; text-transform: uppercase;
    letter-spacing: .06em; color: var(--muted); margin: 26px 0 12px; }
  .cu-cols { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; }
  @media (max-width: 760px) { .cu-cols { grid-template-columns: 1fr; } }
  /* Best & worst are stacked full-width, one under the other. */
  .cu-stack { display: flex; flex-direction: column; gap: 16px; }
  .cu-col { border: 1px solid var(--rule); border-radius: 12px; padding: 14px 16px; }
  .cu-h { font-size: 14px; font-weight: 700; color: var(--ink); margin-bottom: 10px;
    display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .cu-h-s, .note-state { font-size: 11px; font-weight: 500; color: var(--muted); }
  .cu-none { font-size: 12.5px; color: var(--muted); padding: 6px 0; }

  .cu-ad { display: flex; align-items: center; gap: 10px; padding: 8px 0;
    border-top: 1px solid var(--rule); }
  .cu-ad:first-of-type { border-top: none; }
  .cu-th { width: 46px; height: 30px; border-radius: 5px; object-fit: cover;
    background: var(--wash); flex: none; display: block; }
  .cu-ad-b { flex: 1; min-width: 0; }
  .cu-ad-n { font-size: 13px; font-weight: 600; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cu-ad-m { font-size: 11px; color: var(--muted); white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .cu-ad-s { text-align: right; font-size: 11.5px; color: var(--muted);
    display: flex; flex-direction: column; gap: 1px; flex: none; }
  .cu-ad-s .cu-roas { font-weight: 700; }
  .cu-ad.win .cu-th { box-shadow: inset 0 0 0 2px var(--up); }
  .cu-ad.lose .cu-th { box-shadow: inset 0 0 0 2px var(--down); }

  .cu-bar-row { display: flex; align-items: center; gap: 10px; margin: 7px 0;
    font-size: 12.5px; }
  .cu-bar-n { width: 130px; flex: none; color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .cu-bar-t { flex: 1; height: 9px; background: var(--wash); border-radius: 5px;
    overflow: hidden; }
  .cu-bar-t i { display: block; height: 100%; border-radius: 5px; }
  .cu-bar-p { width: 38px; text-align: right; color: var(--muted); flex: none; }

  .cu-aud { display: flex; justify-content: space-between; gap: 10px;
    padding: 7px 0; border-top: 1px solid var(--rule); font-size: 12.5px; }
  .cu-aud:first-of-type { border-top: none; }
  .cu-aud-n { color: var(--ink); font-weight: 600; white-space: nowrap;
    overflow: hidden; text-overflow: ellipsis; }
  .cu-aud-v { color: var(--muted); flex: none; }

  /* Winners-only scenario table. */
  .cu-scenario { border-color: var(--up); }
  .cu-sc-wrap { overflow-x: auto; }
  .cu-sc { width: 100%; border-collapse: collapse; font-size: 13px; }

  .linkbtn {
    display: inline-block; margin-top: 10px; background: none; border: none;
    padding: 0; color: var(--muted); font-size: 13px; cursor: pointer;
    text-decoration: underline; font-family: var(--sans);
  }
  .linkbtn:hover { color: var(--accent); }
  .logo-upl {
    margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--rule);
  }
  .logo-upl-h { font-weight: 600; font-size: 13.5px; color: var(--ink); }
  .logo-upl-sub {
    display: block; font-size: 12.5px; color: var(--muted); margin: 2px 0 4px;
  }
  .shot .shot-n {
    display: block; font-size: 10.5px; color: var(--muted); padding: 4px 6px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .bundle-warn {
    margin-top: 6px; color: #8A5A12; background: #FFF7EC;
    border: 1px solid #F2D9A8; border-radius: 8px; padding: 7px 10px;
    font-size: 12.5px;
  }
  .toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: #fff; padding: 10px 18px; border-radius: 10px;
    font-size: 13.5px; opacity: 0; pointer-events: none; transition: opacity .25s;
  }
  .toast.show { opacity: 1; }
  @media (prefers-reduced-motion: reduce) { .seg { transition: none; } }

  /* --- Lockhern brand header ------------------------------------------- */
  .brandrow { margin-bottom: 14px; }
  .brandlogo { height: 30px; width: auto; display: block; }
  .brandword {
    font-family: var(--sans); font-weight: 500; letter-spacing: .14em;
    font-size: 15px; color: var(--muted);
  }
  .brandword b { color: var(--accent); font-weight: 700; }

  /* --- Storyboard ------------------------------------------------------ */
  .story-intro {
    background: var(--deep); color: #fff; border-radius: 16px;
    padding: 20px 22px; margin-bottom: 18px;
  }
  .story-intro h3 {
    margin: 0 0 6px; font-family: var(--display); font-weight: 600;
    font-size: 20px; color: #fff;

  .story-intro p { margin: 0; color: var(--faint); font-size: 14px; max-width: 70ch; }
  .story-actions { margin-top: 14px; display: flex; gap: 10px; flex-wrap: wrap; }
  .slides { display: grid; grid-template-columns: 1fr; gap: 14px; }
  .slide {
    display: grid; grid-template-columns: 46px 1fr; gap: 16px;
    background: var(--card); border: 1px solid var(--rule); border-radius: 14px;
    box-shadow: var(--lift); padding: 16px 18px;
  }
  .slide .num {
    width: 34px; height: 34px; border-radius: 9px; display: flex;
    align-items: center; justify-content: center; font-weight: 700;
    font-size: 14px; color: #fff; background: var(--accent);
  }
  .slide.is-title .num, .slide.is-closing .num { background: var(--accent); }
  .slide.is-creative .num { background: var(--accent-2); }
  .slide .body { min-width: 0; }
  .slide .head { display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; }
  .slide .head h4 {
    margin: 0; font-family: var(--display); font-weight: 600; font-size: 17px;
    color: var(--ink);
  }
  .slide .kind {
    font-size: 11px; letter-spacing: .06em; text-transform: uppercase;
    color: var(--muted); background: var(--wash); border: 1px solid var(--rule);
    padding: 2px 8px; border-radius: 999px;
  }
  .slide .summary { margin: 6px 0 10px; color: var(--ink-soft); font-size: 14px; }
  .slide .preview { margin: 4px 0 12px; }
  .slide textarea.note {
    width: 100%; min-height: 58px; resize: vertical; border-radius: 10px;
    border: 1px solid var(--rule); background: var(--wash); padding: 9px 11px;

  .slide textarea.note:focus {

    display: flex; align-items: center; gap: 10px; margin-top: 6px;

  .slide .note-label {
    font-size: 12px; color: var(--muted); font-weight: 600;
  }
  .slide .note-state { font-size: 12px; color: var(--up); opacity: 0; transition: opacity .2s; }
  .slide .note-state.show { opacity: 1; }

  /* --- Creative scorecard (one page, thumbnail grid) ------------------- */
  .cregrid {
    display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
    gap: 14px;
  }
  .cretile { min-width: 0; }
  .cretile .shot {
    position: relative; aspect-ratio: 16/9; border-radius: 8px;
    overflow: hidden; background: var(--wash); border: 1px solid var(--rule);
  }
  .cretile .shot img {
    width: 100%; height: 100%; object-fit: cover; display: block;
  }
  .cretile .badge {
    position: absolute; top: 6px; left: 6px; background: var(--accent);
    color: #fff; font-size: 10px; font-weight: 700; letter-spacing: .03em;
    padding: 2px 6px; border-radius: 5px;
  }
  .cretile h5 {
    margin: 7px 0 2px; font-size: 12.5px; font-weight: 600; color: var(--ink);
    line-height: 1.25; overflow: hidden; text-overflow: ellipsis;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical;
  }
  .cretile .src { font-size: 11px; color: var(--muted); margin-bottom: 3px; }
  .cretile .src.ai { color: var(--accent); font-weight: 600; }
  .cretile .m {
    font-size: 11px; color: var(--muted); line-height: 1.5;
    font-variant-numeric: tabular-nums;
  }
  .cregrid-foot {
    grid-column: 1 / -1; font-size: 11px; color: var(--muted); margin-top: 2px;
  }

  /* --- Settings: verify-in-platform + manual overrides ----------------- */
  .reviewbox {
    background: #FFF7EC; border: 1px solid #F2D9A8; border-radius: 12px;
    padding: 14px 16px; margin: 4px 0 8px;
  }
  .reviewbox .rb-title { font-weight: 700; color: #8A5A12; margin-bottom: 4px; }
  .reviewbox .rb-sub { color: var(--muted); font-size: 13px; margin-bottom: 10px; }
  .pill-review {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px;
    border-radius: 999px; background: #FBE7C6; color: #8A5A12;
  }
  .pill-manual {
    display: inline-block; font-size: 11px; font-weight: 600; padding: 1px 8px;
    border-radius: 999px; background: #DEEAFB; color: var(--accent);

  .togrow {
    display: flex; align-items: center; justify-content: space-between;

  }

  .togrow .tc { display: flex; align-items: center; gap: 8px; flex: none; }
  select.ovr, input.ovrtext {
    font-family: var(--sans); font-size: 12px; color: var(--ink);
    border: 1px solid var(--rule); border-radius: 7px; padding: 3px 6px;
    background: var(--card);
  }
  input.ovrtext { min-width: 200px; }
  select.ovr:focus, input.ovrtext:focus {
    outline: none; border-color: var(--accent);
    box-shadow: 0 0 0 3px rgba(49,122,224,.12);
  }
  .revrow {
    display: flex; align-items: center; justify-content: space-between;
    gap: 12px; padding: 7px 0; border-bottom: 1px solid var(--rule);
  }
  .revrow:last-child { border-bottom: none; }
  .revrow .rk { font-size: 13px; color: var(--ink-soft); }
  .ovr-state { font-size: 11px; color: var(--up); margin-left: 6px; opacity: 0;
    transition: opacity .2s; }
  .ovr-state.show { opacity: 1; }
  .settings-section {
    margin-top: 26px; padding-top: 22px; border-top: 2px solid var(--rule);
  }
  .ag-camp {
    font-family: var(--display); font-weight: 600; font-size: 15px;
    color: var(--ink); margin: 16px 0 8px;
  }
  .ag-camp:first-of-type { margin-top: 4px; }
  .gtbox {
    background: #EEF3FC; border: 1px solid #C7D8F4; border-radius: 12px;
    padding: 14px 16px; margin: 4px 0 18px;
  }
  .gtbox .rb-title { color: var(--accent); }
  textarea.gt-paste {
    width: 100%; min-height: 92px; resize: vertical; border-radius: 10px;
    border: 1px solid #C7D8F4; background: #fff; padding: 9px 11px;

  textarea.gt-paste:focus {
    outline: none; border-color: var(--accent);

    font-weight: 700; color: var(--ink); margin-bottom: 6px; font-size: 14px;
  }

    font-size: 13.5px; color: var(--ink-soft); line-height: 1.6;
    margin-bottom: 3px;

  @media print {
    nav.tabs, nav.subtabs, .toolbar, .modebar, .star, .story-actions,
    .brandrow { display: none; }
    .panel { display: block; }
    .slide textarea.note { border: none; background: transparent; }

</style>

<body>
<div class="wrap" id="root"></div>
<div class="toast" id="toast"></div>

<script>
var DATA = <?!= payload ? payload : 'null' ?>;
var LABELS = <?!= labels ? labels : '{}' ?>;
var CAN_LABEL = <?!= canLabel ? canLabel : 'false' ?>;
var ACCOUNTS = <?!= accounts ? accounts : '[]' ?>;
var CURRENT_ACCOUNT = <?!= current ? current : '""' ?>;
var BASE_URL = <?!= baseUrl ? baseUrl : '""' ?>;
var BRAND = <?!= brand ? brand : '{}' ?>;
var REPORT_MODE = <?!= reportMode ? reportMode : 'false' ?>;
// Manual setting overrides, keyed "<campaignId>|<field>" (asset toggles use
// "<campaignId>|asset|<TYPE>"). Injected fresh each load, edited in the Settings
// view, saved via google.script.run.saveOverride. Overrides win over the API.
var OVERRIDES = <?!= overrides ? overrides : '{}' ?>;
// Per-slide storyboard notes, keyed by slide key. Live-edited in the Storyboard
// tab and saved back to the Commentary sheet via google.script.run.saveNote.
// Fresh notes injected by doGet win over whatever was baked into the cached
// payload, so a plain reload shows the latest saved edits (e.g. the client plan).
var FRESH_NOTES = <?!= notes ? notes : '{}' ?>;
var NOTES = (function() {
  var base = (DATA && DATA.notes) || {};
  var out = {};
  for (var k in base) out[k] = base[k];
  for (var f in FRESH_NOTES) out[f] = FRESH_NOTES[f];
  return out;
})();
var POV_TAGLINE = 'A full-funnel, creative-led approach to Demand Gen';

if (!DATA) {
  document.getElementById('root').innerHTML =
      '<div class="setup"><h2>No data yet</h2><p>Run <b>setup</b> in the ' +
      'Apps Script project, list your account IDs in the Settings tab, then ' +
      'run <b>refresh</b>. This page reads the cached pull, so it stays fast ' +
      'for whoever you share it with.</p></div>';
} else {
  start();
}

function start() {
var CUR = DATA.account.currency;
var CHANNEL_FILTER = null;
var MODE = 'conversions';
var VIDEO_FILTER = 'all';
var VIDEO_SORT = 'cost';
// Ads/Videos: when on, show only creatives that turned a real profit
// (purchase revenue >= spend, i.e. purchase ROAS >= 1).
var PROFIT_ONLY = false;
// Ads pause workflow: ids checked for pausing, and the spend floor that
// "Select underperformers" uses (only ads that have spent at least this much
// AND returned less revenue than spend are auto-selected).
var SELECTED = {};
var PAUSE_MIN_SPEND = 50;
// The last batch of ads paused live, so a one-click Undo can re-enable exactly
// those. [{id, name}]
var LAST_PAUSED = [];

function money(v) {
  return new Intl.NumberFormat(undefined, { style: 'currency', currency: CUR,
      maximumFractionDigits: Math.abs(v || 0) >= 1000 ? 0 : 2 }).format(v || 0);
}
function int(v) { return Math.round(v || 0).toLocaleString(); }
function dec(v) { return (v || 0).toFixed(2); }
function pct(v) { return ((v || 0) * 100).toFixed(1) + '%'; }
function pct0(v) { return Math.round((v || 0) * 100) + '%'; }
function esc(s) {
  return String(s == null ? '' : s).replace(/[&<>"]/g, function(c) {
    return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c];
  });
}
function toast(text) {
  var el = document.getElementById('toast');
  el.textContent = text;
  el.className = 'toast show';
  setTimeout(function() { el.className = 'toast'; }, 1800);
}

/** Which conversion family the whole dashboard is currently reading. */
function K() {
  return MODE === 'all'
      ? { conv: 'allConversions', cvr: 'allCvr', cpa: 'allCpa',
          value: 'allConvValue', roas: 'allRoas', word: 'All conv.' }
      : { conv: 'conversions', cvr: 'cvr', cpa: 'cpa',
          value: 'convValue', roas: 'roas', word: 'Conversions' };
}

// Header logo: the real Lockhern mark if a data URI is present, otherwise a
// brand-coloured wordmark so the header is never unbranded.
function brandLogoHtml() {
  var src = BRAND.logoColor || BRAND.logoMark || '';
  if (src) {
    return '<img class="brandlogo" src="' + esc(src) + '" alt="' +
        esc(BRAND.name || 'Lockhern Digital') + '">';
  }
  return '<span class="brandword">LOCKHERN <b>DIGITAL</b></span>';
}

document.getElementById('root').innerHTML =
  '<header><div class="brandrow">' + brandLogoHtml() + '</div>' +
    '<div class="kicker">Demand Gen audit</div>' +
    '<div class="titlerow"><h1>' + esc(DATA.account.name) + '</h1>' +
      (ACCOUNTS.length > 1
        ? '<select id="accountPicker" aria-label="Switch account">' +
          ACCOUNTS.map(function(a) {
            return '<option value="' + esc(a.id) + '"' +
                (a.id === CURRENT_ACCOUNT ? ' selected' : '') + '>' +
                esc(a.name) + '</option>';
          }).join('') + '</select>'
        : '') +
      '<button id="discoverBtn" class="disc-btn">Accounts ▾</button>' +
    '</div>' +
    '<div id="acctPanel" class="acct-panel" style="display:none"></div>' +
    '<div class="topai">' +
      '<button class="aibtn" id="topAiBtn">✨ Analyze with AI</button>' +
      '<span class="topai-sub">One click. Claude reads the whole account and ' +
        'writes the strategy the deck leads with — run this before building.' +
        '</span>' +
      '<span id="topAiState" class="ovr-state"></span>' +
    '</div>' +
    '<nav class="appmodes" id="appModes"></nav>' +
    '<div class="modeintro" id="modeIntro"></div>' +
    '<div class="window" id="window"></div>' +
    '</header>' +
  '<div class="card readout analyze-only"><div class="section-label" ' +
    'id="readoutLabel">Overview</div>' +
    '<ul id="readout"></ul></div>' +
  '<section class="spectrum analyze-only"><div class="section-label">Where the budget went</div>' +
    '<div class="spectrum-bar" id="spectrum"></div>' +
    '<div class="legend" id="legend"></div></section>' +
  '<div class="modebar analyze-only"><div class="switch" id="modeSwitch">' +
      '<button data-mode="conversions">Conversions</button>' +
      '<button data-mode="all">All conversions</button></div>' +
    '<span class="mode-hint" id="modeHint"></span></div>' +
  '<div class="impact-card analyze-only" id="impactCard"></div>' +
  '<div class="kpis analyze-only" id="kpis"></div>' +
  '<nav class="tabs" id="tabs"></nav>' +
  '<div class="acc-wrap" id="accordion"></div>' +
  '<div class="note" id="note"></div>' +
  BUILD_SECTION_HTML() +
  BUILD_WIZARD_HTML();

// The build tools (copy buttons + 4-step deck wizard) render only in the
// Audit / Strategy modes, and now sit BELOW the data so the numbers lead.
function BUILD_SECTION_HTML() {
  return '<div class="actionbar build-only">' +
      '<button class="briefbtn" id="briefBtn">Copy analysis brief</button>' +
      '<button class="briefbtn" id="promptBtn">Copy deck design prompt</button>' +
    '</div>';
}
function BUILD_WIZARD_HTML() {
  return '<div class="deckwrap open build-only" id="deckWrap"><div class="buildhead">' +
      '<div class="section-label" style="margin:0">Build the deck</div>' +
      '<div class="rb-sub" style="margin:2px 0 0">Everything below the data. ' +
        'Work through it top to bottom.</div>' +
    '</div><div class="wizard">' +
      '<div class="wstep" id="wstep1"><div class="wnum">1</div><div class="wbody">' +
        '<div class="wtitle">Build the rough deck</div>' +
        '<div class="wsub">Generates the on-brand Google Slides deck from the ' +
          'audit.</div>' +
        '<button class="briefbtn" id="deckBtn">Build rough deck</button>' +
        '<div class="progress" id="deckProg" style="display:none">' +
          '<i id="deckBar"></i></div>' +
        '<div class="progress-label" id="deckLabel"></div>' +
        '<div id="deckResult"></div>' +
      '</div></div>' +
      '<div class="wstep locked" id="wstep2"><div class="wnum">2</div>' +
        '<div class="wbody">' +
        '<div class="wtitle">Add settings screenshots and an optional logo</div>' +
        '<div class="wsub">Recommended. Drop or paste screenshots ' +
          'of each campaign’s settings, the ad-group settings, and the ' +
          'ad-group audience with its exclusions. Claude treats these as the ' +
          'source of truth.</div>' +
        '<div class="dropzone" id="dropzone" tabindex="0">Drop images here, ' +
          'click to choose, or paste (Ctrl/Cmd + V)</div>' +
        '<input type="file" id="shotInput" accept="image/*" multiple hidden>' +
        '<div class="shotstatus" id="shotStatus"></div>' +
        '<div class="shots" id="shots"></div>' +
        '<div class="logo-upl">' +
          '<span class="logo-upl-h">Brand logo (optional)</span>' +
          '<span class="logo-upl-sub">Use a specific or client logo for this ' +
            'deck. Defaults to the Lockhern logo from Drive if left empty.</span>' +
          '<button class="linkbtn" id="logoBtn">Add logo image</button>' +
          '<input type="file" id="logoInput" accept="image/*" multiple hidden>' +
          '<div class="shots" id="uilogos"></div>' +
        '</div>' +
        '<button class="linkbtn" id="skipShots">Skip, build without ' +
          'screenshots</button>' +
      '</div></div>' +
      '<div class="wstep locked" id="wstep3"><div class="wnum">3</div>' +
        '<div class="wbody">' +
        '<div class="wtitle">Package the build bundle</div>' +
        '<div class="wsub">Zips the deck (.pptx), the data (.xlsx), the logos, ' +
          'your screenshots, and the prompt (PROMPT.md) into one download. ' +
          'Add screenshots in step 2, or click Skip, to enable this.</div>' +
        '<button class="briefbtn" id="bundleBtn" disabled>Package and download ' +
          '.zip</button>' +
        '<div class="progress-label" id="bundleLabel"></div>' +
      '</div></div>' +
      '<div class="wstep locked" id="wstep4"><div class="wnum">4</div>' +
        '<div class="wbody">' +
        '<div class="wtitle">Build in Claude</div>' +
        '<div class="wsub">Open Claude (Opus), attach just the one .zip, and ' +
          'paste the short launch message below. Everything Claude needs, ' +
          'including the full prompt (PROMPT.md), is inside the zip.</div>' +
        '<button class="briefbtn" id="wPromptBtn">Copy launch message</button>' +
      '</div></div>' +
    '</div></div>' +
    '<div class="briefwrap" id="briefWrap">' +
      '<textarea id="briefText" readonly aria-label="Copied text"></textarea>' +
      '<p id="briefHint"></p>' +
    '</div>';
}

if (ACCOUNTS.length > 1) {
  document.getElementById('accountPicker').onchange = function() {
    // The web app runs in a sandboxed iframe, so navigate the top frame.
    var url = BASE_URL + '?account=' + encodeURIComponent(this.value);
    if (BASE_URL) { (window.top || window).location.href = url; }
  };
}

// --- account discovery ----------------------------------------------------
// Find every account the tool can audit (via the manager), list them, and let
// the user open a pulled one or audit a new one — no editing the Settings tab.
var DISCOVERED = null;
(function() {
  var btn = document.getElementById('discoverBtn');
  var panel = document.getElementById('acctPanel');
  if (!btn || !panel) return;
  var cached = {};
  ACCOUNTS.forEach(function(a) { cached[String(a.id)] = true; });

  function acctUrl(id) {
    return (BASE_URL || '') + (BASE_URL && BASE_URL.indexOf('?') === -1 ? '?' : '&') +
      'account=' + encodeURIComponent(id);
  }

  function rowHtml(a) {
    var isCached = cached[String(a.id)];
    var right = isCached
      ? '<a class="disc-open" target="_top" href="' + acctUrl(a.id) + '">Open →</a>'
      : '<button class="disc-audit" data-id="' + esc(String(a.id)) + '" ' +
        'data-name="' + esc(a.name) + '">Audit</button>';
    return '<div class="disc-row" data-id="' + esc(String(a.id)) + '">' +
      '<div class="disc-nm">' + esc(a.name) +
        (a.id === CURRENT_ACCOUNT ? ' <span class="disc-cur">current</span>' : '') +
        '<div class="disc-id">' + esc(a.id) +
          (a.currency ? ' · ' + esc(a.currency) : '') + '</div></div>' +
      '<div class="disc-act">' + right + '</div></div>';
  }

  function renderList(list) {
    if (!list || !list.length) {
      panel.innerHTML = '<div class="disc-empty">No accounts found. Check the ' +
        'Manager (MCC) ID in Settings and your access.</div>';
      return;
    }
    panel.innerHTML =
      '<div class="disc-head">' + list.length + ' account' +
        (list.length === 1 ? '' : 's') + ' the tool can audit ' +
        '<button id="discRefresh" class="disc-mini">↻ Refresh list</button></div>' +
      list.map(rowHtml).join('');
    var rr = document.getElementById('discRefresh');
    if (rr) rr.onclick = function() { load(true); };
    var auds = panel.querySelectorAll('.disc-audit');
    for (var i = 0; i < auds.length; i++) auds[i].onclick = auditOne;
  }

  function auditOne() {
    var id = this.getAttribute('data-id');
    var name = this.getAttribute('data-name');
    var daysSel = document.getElementById('cuDays');
    var days = Number(daysSel && daysSel.value) || (DATA.account &&
      windowDays(DATA.account)) || 90;
    var pausedBox = document.getElementById('cuPaused');
    var incl = pausedBox ? !!pausedBox.checked :
      (DATA.account ? DATA.account.includePaused !== false : true);
    if (!window.confirm('Audit "' + name + '" over the last ' + days + ' days? ' +
        'This runs the live pull and can take a minute.')) return;
    var btnEl = this;
    btnEl.disabled = true; btnEl.textContent = 'Pulling…';
    google.script.run
      .withSuccessHandler(function(res) {
        if (res && res.ok) {
          var row = panel.querySelector('.disc-row[data-id="' + id + '"] .disc-act');
          if (row) row.innerHTML = '<a class="disc-open" href="' + acctUrl(id) +
            '">Open →</a>';
        } else {
          btnEl.disabled = false; btnEl.textContent = 'Retry';
          toast('Audit failed: ' + ((res && res.error) || 'unknown'));
        }
      })

/**
 * Both copy buttons share one panel. The async clipboard API is frequently
 * blocked inside the web app's sandboxed iframe, so fall back to execCommand
 * and finally to leaving the text selected for a manual copy.
 */
function copyPanel(text, hint, missing) {
  var area = document.getElementById('briefText');
  var wrap = document.getElementById('briefWrap');
  var value = text || missing;

  area.value = value;
  document.getElementById('briefHint').textContent = hint;
  wrap.className = 'briefwrap open';
  area.focus();
  area.select();

  if (!text) {
    toast('Nothing to copy yet');
    return;
  }

  function ok() { toast('Copied \u2014 paste into Claude'); }
  function legacy() {
    try {
      toast(document.execCommand('copy') ? 'Copied \u2014 paste into Claude'
                                         : 'Select the text below and copy');
    } catch (e) {
      toast('Select the text below and copy');
    }
  }
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) {
      navigator.clipboard.writeText(value).then(ok, legacy);
      return;
    }
  } catch (e) {
    // Fall through to the legacy path.
  }
  legacy();
}

function triggerDownload(bytesB64, name, mime) {
  var bin = atob(bytesB64), len = bin.length, bytes = new Uint8Array(len);
  for (var i = 0; i < len; i++) bytes[i] = bin.charCodeAt(i);
  var url = URL.createObjectURL(new Blob([bytes], { type: mime }));
  var a = document.createElement('a');
  a.href = url; a.download = name;
  document.body.appendChild(a); a.click();
  setTimeout(function() { URL.revokeObjectURL(url); a.remove(); }, 1500);
}

// --- Full-funnel visual ---------------------------------------------------
// A reverse pyramid for the whole account: impressions -> views -> add to cart
// -> begin checkout -> orders (with revenue). Widths step down so it reads as a
// funnel; the numbers carry the magnitude, and each stage shows its conversion
// rate from the stage above.
function drawFunnel() {
  var el = document.getElementById('funnelCard');
  if (!el) return;
  var f = DATA.funnel;
  if (!f || (!f.pageViews && !f.orders)) { el.style.display = 'none'; return; }
  el.style.display = '';
  var stages = [
    { label: 'Page views', v: f.pageViews || 0 },
    { label: 'Add to cart', v: f.atc || 0 },
    { label: 'Begin checkout', v: f.checkout || 0 },
    { label: 'Orders', v: f.orders || 0, rev: f.revenue || 0 }
  ].filter(function(s, i) { return i === 0 || i === 3 || s.v > 0; });
  var widths = [100, 74, 52, 32];
  var body = stages.map(function(s, i) {
    var prev = i > 0 ? stages[i - 1].v : 0;
    var rate = (i > 0 && prev) ? '  ·  ' + pct0(s.v / prev) + ' of prior' : '';
    var val = (s.rev != null)
        ? int(s.v) + ' orders  ·  ' + money(s.rev) + ' revenue'
        : int(s.v);
    return '<div class="fn-row"><div class="fn-bar" style="width:' +
      widths[Math.min(i, widths.length - 1)] + '%">' +
      '<span class="fn-label">' + esc(s.label) + '</span>' +
      '<span class="fn-val">' + val + rate + '</span></div></div>';
  }).join('');
  el.innerHTML = '<div class="section-label">Full-funnel impact ' +
    '(Demand Gen, whole account)</div><div class="funnelviz">' + body + '</div>';
}

      '<div class="iv">' + value + '</div>' +
      (sub ? '<div class="is">' + sub + '</div>' : '') + '</div>';
  }
  var roas = (Number(r.roas) || 0).toFixed(2) + 'x';
  var tiles =
    tile('Orders', int(r.orders),
      r.vt ? int(r.vt) + ' via view-through' : '') +

    tile('ROAS', '<span style="color:' + (r.roas >= 1 ? '#8FE3B0' : '#FFC9C9') +
      '">' + roas + '</span>', r.roas >= 1 ? 'net positive' : 'below breakeven') +
    tile('Cost per order', r.orders ? money(r.cpo) : '—', money(r.spend) + ' spend');
  el.innerHTML = '<div class="impact-head">Real Demand Gen impact' +

    'all-conversions column</span></div><div class="impact-grid">' + tiles +
